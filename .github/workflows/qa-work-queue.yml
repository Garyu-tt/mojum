name: QA work queue

on:
  pull_request:
    paths:
      - "src/mojum/qa_work_queue.py"
      - "tests/test_qa_work_queue.py"
      - "docs/QA_WORK_QUEUE_R01.md"
      - ".github/workflows/qa-work-queue.yml"
  push:
    branches: [main]
    paths:
      - "src/mojum/qa_work_queue.py"
      - "tests/test_qa_work_queue.py"
      - "docs/QA_WORK_QUEUE_R01.md"
      - ".github/workflows/qa-work-queue.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated queue tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_qa_work_queue -v
