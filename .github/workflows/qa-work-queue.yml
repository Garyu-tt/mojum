name: Mojum QA work queue contract
on:
  pull_request:
    paths:
      - "src/mojum/qa_work_queue.py"
      - "tests/test_qa_work_queue.py"
      - "docs/QA_WORK_QUEUE_R01.md"
      - ".github/workflows/qa-work-queue.yml"
  push:
    branches:
      - "build/1179-durable-qa-queue-20261123-2226"
    paths:
      - "src/mojum/qa_work_queue.py"
      - "tests/test_qa_work_queue.py"
      - ".github/workflows/qa-work-queue.yml"
permissions:
  contents: read
jobs:
  queue-contract:
    name: queue-contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install package and test runner
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run durable queue contract tests
        run: python -m pytest -q tests/test_qa_work_queue.py
