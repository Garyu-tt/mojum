name: Body acceleration audit focused QA

on:
  pull_request:
    paths:
      - ".github/workflows/body-acceleration-audit-qa.yml"
      - "src/mojum/body_acceleration_audit.py"
      - "tests/test_body_acceleration_audit.py"
      - "docs/BODY_ACCELERATION_AUDIT_R01.md"
  push:
    branches:
      - "build/5-body-acceleration-audit-20261123"
    paths:
      - ".github/workflows/body-acceleration-audit-qa.yml"
      - "src/mojum/body_acceleration_audit.py"
      - "tests/test_body_acceleration_audit.py"
      - "docs/BODY_ACCELERATION_AUDIT_R01.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: CPython ${{ matrix.python-version }} body acceleration audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile module and tests
        run: python -m py_compile src/mojum/body_acceleration_audit.py tests/test_body_acceleration_audit.py
      - name: Run focused regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_body_acceleration_audit.py" -v
