name: Spartan dispatcher lease and contract QA

on:
  pull_request:
    paths:
      - 'tools/spartan_coordinator.py'
      - 'tests/test_spartan_coordinator.py'
      - 'docs/SPARTAN_300_R01.md'
      - '.github/workflows/spartan-dispatcher-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spartan-dispatcher-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lease-contract:
    name: lease-contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run credential-free SQLite dispatcher tests
        run: python -m unittest discover -s tests -p 'test_spartan_coordinator.py' -v
