name: QA runnable selection
on:
  pull_request:
    paths:
      - "src/mojum/qa_runnable_selection.py"
      - "tests/test_qa_runnable_selection.py"
      - "docs/QA_RUNNABLE_SELECTION_R01.md"
      - ".github/workflows/qa-runnable-selection.yml"
  push:
    branches:
      - "build/1179-blocked-task-skip-20261123-gpt6"
    paths:
      - "src/mojum/qa_runnable_selection.py"
      - "tests/test_qa_runnable_selection.py"
      - ".github/workflows/qa-runnable-selection.yml"
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_qa_runnable_selection.py' -v
