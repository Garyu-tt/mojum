name: Mojum full Python regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-stdlib-suite:
    name: Python ${{ matrix.python-version }} / all tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout PR or main revision
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check all Python source files compile
        run: python -m compileall -q src tests
      - name: Run full CPU-first standard-library test suite
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
