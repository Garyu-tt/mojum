name: Mojum R0.16 PRIVATE exporter owner-only directory gate

on:
  pull_request:
    paths:
      - ".github/workflows/r016-private-output-directory.yml"
      - "src/mojum/aquarium_trace_export.py"
      - "tests/test_r016_private_export_directory_guard.py"
  push:
    paths:
      - ".github/workflows/r016-private-output-directory.yml"
      - "src/mojum/aquarium_trace_export.py"
      - "tests/test_r016_private_export_directory_guard.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojum-r016-private-output-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-directory-qa:
    name: owner-only-POSIX (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Real segmented SQLite, export privacy and explicit refusal gate
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_r016_private_export_directory_guard.py -v
