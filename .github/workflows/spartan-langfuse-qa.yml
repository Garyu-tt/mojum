name: Spartan Langfuse strict CI and QA status contract

on:
  pull_request:
    paths:
      - 'tools/spartan_langfuse.py'
      - 'tests/test_spartan_langfuse.py'
      - 'docs/SPARTAN_LANGFUSE_R01.md'
      - '.github/workflows/spartan-langfuse-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langfuse-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify strict offline Langfuse allowlist and CI/QA outcomes
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_spartan_langfuse.py' -v
