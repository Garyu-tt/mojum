name: Spartan Local Fleet independent QA

on:
  pull_request:
    paths:
      - 'tools/spartan_local_fleet.py'
      - 'tools/spartan_coordinator.py'
      - 'tests/test_spartan_local_fleet.py'
      - 'tests/test_spartan_mirbi_profile.py'
      - 'docs/SPARTAN_LOCAL_FLEET_R01.md'
      - 'docs/SPARTAN_MIRBI_CPU_R01.md'
      - '.github/workflows/spartan-local-fleet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-leases-and-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile bounded modules
        run: python -m py_compile tools/spartan_coordinator.py tools/spartan_local_fleet.py
      - name: Offline local worker QA (no real endpoint or credentials)
        env:
          PYTHONPATH: .
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover -s tests -p 'test_spartan_local_fleet.py' -v
          python -m unittest discover -s tests -p 'test_spartan_mirbi_profile.py' -v
