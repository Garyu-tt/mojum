name: Mojum optional Gymnasium adapter independent QA

on:
  pull_request:
    paths:
      - 'src/mojum/point_room_env.py'
      - 'src/mojum/gymnasium_adapter.py'
      - 'tests/test_point_room_env.py'
      - 'tests/test_gymnasium_adapter.py'
      - '.github/workflows/gymnasium-optional-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  actual-gymnasium:
    name: actual-gymnasium (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated pinned optional wheels
        run: python -m pip install --only-binary=:all: 'gymnasium==1.4.0' 'numpy==2.3.5'
      - name: Assert real external dependencies are installed
        run: python -c "import gymnasium, numpy; assert gymnasium.__version__ == '1.4.0'; assert numpy.__version__ == '2.3.5'"
      - name: Run installed Gymnasium smoke tests (no skip)
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_gymnasium_adapter.py' -v
      - name: Check Gymnasium environment conformance
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          from gymnasium.utils.env_checker import check_env
          from mojum.gymnasium_adapter import make_gymnasium_point_room
          from mojum.world_room import Room
          env = make_gymnasium_point_room(Room(4, 4), start=(1, 1))
          check_env(env, skip_render_check=True)
          env.close()
          PY
