name: GENESIS recombination QA

on:
  pull_request:
    paths:
      - "src/mojum/genesis.py"
      - "src/mojum/genesis_recombination.py"
      - "tests/test_genesis_recombination.py"
      - "docs/GENESIS_RECOMBINATION_R01.md"
      - ".github/workflows/genesis-recombination.yml"
  push:
    branches:
      - "build/4-genesis-recombination-20261123"

permissions:
  contents: read

jobs:
  focused:
    name: Python ${{ matrix.python-version }} / GENESIS recombination
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused deterministic contract suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_genesis_recombination.py" -v
