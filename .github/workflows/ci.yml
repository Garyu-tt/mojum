name: Mojum R0.1 CPU contract tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Graph runner tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: First-loop smoke test
        env:
          PYTHONPATH: src
        run: python -m mojum examples/first_loop.json --ticks 120 --dt-ms 10
