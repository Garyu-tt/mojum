name: CR-SQLite synthetic metadata spike CI
on:
  pull_request:
    paths:
      - 'src/mojum/crsqlite_collab_spike.py'
      - 'src/mojum/crsqlite_native_spike.py'
      - 'tests/test_crsqlite*.py'
      - 'docs/CRSQLITE_COLLAB_R01.md'
      - '.github/workflows/crsqlite-collab-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run bounded offline CRDT tests (NO native extension)
        env:
          PYTHONPATH: src
          PYTHONNOUSERSITE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_crsqlite*.py' -v
          python -m mojum.crsqlite_collab_spike
