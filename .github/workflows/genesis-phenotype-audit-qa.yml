name: GENESIS phenotype audit focused QA

on:
  pull_request:
    paths:
      - "src/mojum/genesis_phenotype_audit.py"
      - "tests/test_genesis_phenotype_audit.py"
      - "src/mojum/genesis.py"
      - ".github/workflows/genesis-phenotype-audit-qa.yml"
  push:
    branches:
      - "build/4-genesis-phenotype-audit-20261123-r01"
    paths:
      - "src/mojum/genesis_phenotype_audit.py"
      - "tests/test_genesis_phenotype_audit.py"
      - "src/mojum/genesis.py"
      - ".github/workflows/genesis-phenotype-audit-qa.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    name: CPython ${{ matrix.python-version }} phenotype audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile implementation and focused tests
        run: python -m py_compile src/mojum/genesis_phenotype_audit.py tests/test_genesis_phenotype_audit.py
      - name: Run focused stdlib tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_genesis_phenotype_audit.py" -v
