name: Mojum v3 + streaming/HMAC interoperability QA

on:
  pull_request:
    paths:
      - ".github/workflows/integrated-localcell-signed-stream.yml"
      - "src/mojum/aquarium.py"
      - "src/mojum/cell_policy_v2.py"
      - "src/mojum/cell_policy_v3.py"
      - "src/mojum/verified_snapshot.py"
      - "src/mojum/noosphere.py"
      - "tests/test_localcell_signed_stream.py"
      - "tests/test_aquarium_cell_policy_v3.py"
      - "src/mojum/portable_host.py"
      - "tests/test_localcell_portable_host.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-stream-version-pinning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exercise v3 bounded memory and cold SQLite replay
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_aquarium_cell_policy_v3.py -v
      - name: Exercise v1/v2/v3 signed and unsigned streaming interop
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_localcell_signed_stream.py -v
      - name: Exercise offline portable host v3 and episode capacity guard
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_localcell_portable_host.py -v
