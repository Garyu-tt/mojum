name: Mojum R0.15 canonical v4 sensory continuation QA

on:
  pull_request:
    paths:
      - ".github/workflows/r015-v4-sensory-v2.yml"
      - "src/mojum/aquarium.py"
      - "src/mojum/aquarium_wire.py"
      - "src/mojum/portable_host.py"
      - "src/mojum/sensory_associations_v2.py"
      - "src/mojum/sensory_bridge_v2.py"
      - "tests/test_aquarium_epoch_v4.py"
      - "tests/test_portable_host.py"
      - "tests/test_sensory_associations_v2.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-attempt-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  canonical-v4-sensory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile canonical sensory modules
        run: python -m compileall -q src tests
      - name: Replay v4 plus versioned sensory across the epoch boundary
        env:
          PYTHONPATH: src
          MOJUM_V4_SENSORY_V2_STRESS: "1"
        run: python -m unittest tests.test_sensory_associations_v2 -v
