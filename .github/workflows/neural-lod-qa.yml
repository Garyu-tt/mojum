name: Neural population LOD R01

on:
  push:
    branches: [main]
    paths:
      - 'src/mojum/neural_lod.py'
      - 'tests/test_neural_lod.py'
      - 'docs/NEURAL_LOD_R01.md'
      - '.github/workflows/neural-lod-qa.yml'
  pull_request:
    paths:
      - 'src/mojum/neural_lod.py'
      - 'tests/test_neural_lod.py'
      - 'docs/NEURAL_LOD_R01.md'
      - '.github/workflows/neural-lod-qa.yml'

permissions:
  contents: read

concurrency:
  group: neural-lod-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile src/mojum/neural_lod.py tests/test_neural_lod.py
      - name: Run focused tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_neural_lod.py' -v
