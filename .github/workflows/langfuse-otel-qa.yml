name: Mojum Langfuse OTLP privacy QA

on:
  pull_request:
    paths:
      - 'src/mojum/langfuse_otel.py'
      - 'tests/test_langfuse_otel.py'
      - '.github/workflows/langfuse-otel-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langfuse-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify privacy boundary without any external dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_langfuse_otel.py' -v
      - name: Compile source and tests
        run: python -m compileall -q src/mojum/langfuse_otel.py tests/test_langfuse_otel.py
