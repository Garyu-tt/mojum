name: Spartan patch lexical preflight QA

on:
  pull_request:
    paths:
      - 'tools/spartan_patch_preflight.py'
      - 'tests/test_spartan_patch_preflight.py'
      - 'docs/SPARTAN_PATCH_PREFLIGHT_R01.md'
      - '.github/workflows/spartan-patch-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-preflight:
    name: patch-preflight-stdlib (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile targeted modules
        run: python -m compileall -q tools/spartan_patch_preflight.py tests/test_spartan_patch_preflight.py
      - name: Run patch preflight regressions
        run: python -m unittest discover -s tests -p 'test_spartan_patch_preflight.py' -v
