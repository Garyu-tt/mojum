name: Offline graph preview QA

on:
  pull_request:
    paths:
      - "tools/graph_preview/**"
      - "tests/test_graph_preview.py"
      - "docs/GRAPH_PREVIEW_R01.md"
      - ".github/workflows/graph-preview-qa.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline preview safety tests
        run: python -m unittest discover -s tests -p "test_graph_preview.py" -v
