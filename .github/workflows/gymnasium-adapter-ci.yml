name: Mojum optional Gymnasium adapter QA
on:
  pull_request:
    paths:
      - 'src/mojum/point_room_env.py'
      - 'src/mojum/gymnasium_adapter.py'
      - 'tests/test_point_room_env.py'
      - 'tests/test_gymnasium_adapter.py'
      - '.github/workflows/gymnasium-adapter-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/mojum/point_room_env.py'
      - 'src/mojum/gymnasium_adapter.py'
      - 'tests/test_point_room_env.py'
      - 'tests/test_gymnasium_adapter.py'
      - '.github/workflows/gymnasium-adapter-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  optional-gymnasium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only optional test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'gymnasium>=1.1,<2'
      - name: Exercise real Gymnasium spaces, reset and step
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_point_room_env tests.test_gymnasium_adapter -v
      - name: Validate Gymnasium Env compatibility
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from gymnasium.utils.env_checker import check_env
          from mojum.gymnasium_adapter import make_gymnasium_point_room
          from mojum.world_room import Room
          env = make_gymnasium_point_room(Room(4, 4), start=(1, 1), max_steps=16)
          check_env(env, skip_render_check=True)
          env.close()
          PY
