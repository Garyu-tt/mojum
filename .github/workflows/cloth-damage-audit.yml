name: cloth-damage-audit
on:
  pull_request:
    paths:
      - "src/mojum/cloth_damage.py"
      - "tests/test_cloth_damage.py"
      - "docs/CLOTH_DAMAGE_AUDIT_R01.md"
      - ".github/workflows/cloth-damage-audit.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_cloth_damage -v
