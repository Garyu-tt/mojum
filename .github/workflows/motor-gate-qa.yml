name: Mojum motor-gate independent QA
on:
  push:
  pull_request:
jobs:
  motor-gate-stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Motor gate regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_motor_gate.py' -v
