name: Mojum motor-gate independent QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # Cancel only superseded first attempts. A rerun of an old PR head must not
  # cancel the required Motor Gate check for the current exact head.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}
jobs:
  motor-gate-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Motor gate regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_motor_gate.py' -v
