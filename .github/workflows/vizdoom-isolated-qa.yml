name: ViZDoom isolated synthetic CPU QA

on:
  pull_request:
    paths:
      - 'src/mojum/vizdoom_benchmark.py'
      - 'tests/test_vizdoom_benchmark.py'
      - 'docs/VIZDOOM_ISOLATED_BENCHMARK_R01.md'
      - '.github/workflows/vizdoom-isolated-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test synthetic contract and fail-closed native boundaries
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_vizdoom_benchmark.py' -v
      - name: Replay isolated deterministic CPU fixture
        env:
          PYTHONPATH: src
        run: |
          python -m mojum.vizdoom_benchmark --engine fixture --seed 7 --steps 32
