name: Mojum mesh replica preflight independent QA

on:
  pull_request:
    paths:
      - ".github/workflows/mesh-replica-preflight-qa.yml"
      - "src/mojum/mesh_replica_preflight.py"
      - "tests/test_mesh_replica_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline metadata-only two-copy admission and hostile direct API
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_mesh_replica_preflight.py -v
