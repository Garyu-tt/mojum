name: Rigid cloth benchmark contract

on:
  pull_request:
    paths:
      - "tools/integration_benchmarks/rigid_cloth_benchmark.py"
      - "tests/test_rigid_cloth_benchmark.py"
      - "docs/RIGID_CLOTH_BENCHMARK_R01.md"
      - ".github/workflows/rigid-cloth-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "tools/integration_benchmarks/rigid_cloth_benchmark.py"
      - "tests/test_rigid_cloth_benchmark.py"
      - "docs/RIGID_CLOTH_BENCHMARK_R01.md"
      - ".github/workflows/rigid-cloth-benchmark.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline contract tests
        run: python -m unittest discover -s tests -p 'test_rigid_cloth_benchmark.py' -v
