name: ViZDoom offline navigation example
on:
  push:
    paths:
      - "examples/vizdoom/offline_navigation.py"
      - "tests/test_vizdoom_example.py"
      - "docs/VIZDOOM_OFFLINE_EXAMPLE_R01.md"
      - ".github/workflows/vizdoom-example.yml"
  pull_request:
    paths:
      - "examples/vizdoom/offline_navigation.py"
      - "tests/test_vizdoom_example.py"
      - "docs/VIZDOOM_OFFLINE_EXAMPLE_R01.md"
      - ".github/workflows/vizdoom-example.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact checked-out commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run focused offline navigation tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_vizdoom_example.py" -v
