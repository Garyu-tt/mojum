name: Mojum R0.15 explicit v4 epoch and SQLite replay QA

on:
  pull_request:
    paths:
      - ".github/workflows/r015-epoch-v4.yml"
      - "src/mojum/epoch_sense_v2.py"
      - "src/mojum/cell_policy_v4.py"
      - "src/mojum/aquarium.py"
      - "src/mojum/portable_host.py"
      - "tests/test_epoch_v4.py"
      - "tests/test_epoch_v4_native_keys.py"
      - "docs/R015_EXPLICIT_EPOCH_V4.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  epoch-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Real 10050-tick SQLite absolute epoch + HMAC and full replay
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_epoch_v4.py -v
      - name: Reject hostile Local Cell v4 in-memory mapping keys
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_epoch_v4_native_keys.py -v
      - name: Strict compatibility with signed v1/v2/v3 journals
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_localcell_signed_stream.py -v
      - name: New epoch CLI, still bounded and synthetic
        env:
          PYTHONPATH: src
        run: |
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          python -m mojum.aquarium --db "$root/v4.sqlite3" --exploration-mode goal_free --sensory-mode none --developmental-policy local_cell_v4 --ticks 3
