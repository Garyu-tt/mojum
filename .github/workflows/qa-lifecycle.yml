name: QA lifecycle policy
on:
  pull_request:
    paths:
      - "src/mojum/qa_lifecycle.py"
      - "tests/test_qa_lifecycle.py"
      - "docs/QA_LIFECYCLE_R01.md"
      - ".github/workflows/qa-lifecycle.yml"
  push:
    branches: ["main"]
    paths:
      - "src/mojum/qa_lifecycle.py"
      - "tests/test_qa_lifecycle.py"
      - ".github/workflows/qa-lifecycle.yml"
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested revision
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest tests.test_qa_lifecycle -v
