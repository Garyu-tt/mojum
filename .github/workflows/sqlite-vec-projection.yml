name: Mojum opt-in sqlite-vec projection QA

on:
  pull_request:
    paths:
      - "src/mojum/sqlite_vec_projection.py"
      - "tests/test_sqlite_vec_projection.py"
      - "pyproject.toml"
      - ".github/workflows/sqlite-vec-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-vec0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact opt-in native extension
        run: python -m pip install 'sqlite-vec==0.1.9'
      - name: Real vec0 create, query, rebuild and corruption regression
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p 'test_sqlite_vec_projection.py' -v
