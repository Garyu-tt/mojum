name: Mikoshi coordination and homeostasis R01

on:
  push:
    branches: [main]
    paths:
      - 'src/mojum/cerebellar_coordination.py'
      - 'src/mojum/autonomic_homeostasis.py'
      - 'tests/test_cerebellar_homeostasis.py'
      - 'docs/MIKOSHI_CEREBELLAR_HOMEOSTASIS_R01.md'
      - '.github/workflows/mikoshi-cerebellar-homeostasis.yml'
  pull_request:
    paths:
      - 'src/mojum/cerebellar_coordination.py'
      - 'src/mojum/autonomic_homeostasis.py'
      - 'tests/test_cerebellar_homeostasis.py'
      - 'docs/MIKOSHI_CEREBELLAR_HOMEOSTASIS_R01.md'
      - '.github/workflows/mikoshi-cerebellar-homeostasis.yml'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  fixed-point-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile versioned interfaces
        run: >-
          python -m py_compile
          src/mojum/cerebellar_coordination.py
          src/mojum/autonomic_homeostasis.py
          tests/test_cerebellar_homeostasis.py
      - name: Run deterministic fixed-point contracts
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests/test_cerebellar_homeostasis.py -v
