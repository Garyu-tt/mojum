name: Mesh replication lag exact-head QA

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mojum/mesh_replication_lag.py"
      - "tests/test_mesh_replication_lag.py"
      - "docs/MESH_REPLICATION_LAG_R01.md"
      - ".github/workflows/mesh-replication-lag-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact pull request head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused stdlib suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_mesh_replication_lag.py' -v
