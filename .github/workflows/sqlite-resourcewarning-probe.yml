name: SQLite ResourceWarning probe QA
on:
  pull_request:
    paths:
      - "tools/sqlite_resourcewarning_probe.py"
      - "tests/test_sqlite_resourcewarning_probe.py"
      - "docs/SQLITE_RESOURCEWARNING_PROBE.md"
      - ".github/workflows/sqlite-resourcewarning-probe.yml"
  push:
    branches: ["qa/121-sqlite-warning-trace-20261123-2128"]
    paths:
      - "tools/sqlite_resourcewarning_probe.py"
      - "tests/test_sqlite_resourcewarning_probe.py"
      - "docs/SQLITE_RESOURCEWARNING_PROBE.md"
      - ".github/workflows/sqlite-resourcewarning-probe.yml"
permissions:
  contents: read
jobs:
  probe-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact checked-out PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run probe contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_sqlite_resourcewarning_probe.py" -v
