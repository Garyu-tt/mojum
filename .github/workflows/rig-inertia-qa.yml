name: Rig inertial metadata QA

on:
  pull_request:
    paths:
      - "src/mojum/rig_inertia.py"
      - "tests/test_rig_inertia.py"
      - "docs/RIG_INERTIA_R01.md"
      - ".github/workflows/rig-inertia-qa.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile module and tests
        run: python -m py_compile src/mojum/rig_inertia.py tests/test_rig_inertia.py
      - name: Run focused offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_rig_inertia.py" -v
