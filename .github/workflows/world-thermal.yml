name: world-thermal

on:
  pull_request:
    paths:
      - ".github/workflows/world-thermal.yml"
      - "src/mojum/world_thermal.py"
      - "tests/test_world_thermal.py"
      - "docs/WORLD_THERMAL_R01.md"
  push:
    branches:
      - "build/7-world-thermal-20261124"
    paths:
      - ".github/workflows/world-thermal.yml"
      - "src/mojum/world_thermal.py"
      - "tests/test_world_thermal.py"
      - "docs/WORLD_THERMAL_R01.md"

permissions:
  contents: read

jobs:
  thermal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile module and tests
        run: python -m compileall -q src/mojum/world_thermal.py tests/test_world_thermal.py
      - name: Run focused regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_world_thermal.py" -v
