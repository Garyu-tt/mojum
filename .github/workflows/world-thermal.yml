name: world-thermal

on:
  pull_request:
    paths:
      - "src/mojum/world_thermal.py"
      - "tests/test_world_thermal.py"
      - "docs/WORLD_THERMAL_R01.md"
      - ".github/workflows/world-thermal.yml"
  push:
    branches: [main]
    paths:
      - "src/mojum/world_thermal.py"
      - "tests/test_world_thermal.py"
      - "docs/WORLD_THERMAL_R01.md"
      - ".github/workflows/world-thermal.yml"

permissions:
  contents: read

jobs:
  thermal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused thermal tests
        run: PYTHONPATH=src python -m unittest tests.test_world_thermal -v
      - name: Compile source
        run: python -m compileall -q src/mojum/world_thermal.py tests/test_world_thermal.py
