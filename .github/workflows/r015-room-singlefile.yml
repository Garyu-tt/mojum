name: Mojum single-file offline SVG editor QA

on:
  pull_request:
    paths:
      - ".github/workflows/r015-room-singlefile.yml"
      - "tools/package_room_designer.py"
      - "tools/room_designer.html"
      - "tools/room_designer_core.js"
      - "tools/room_designer_history.js"
      - "tools/room_walk_preview.js"
      - "pyproject.toml"
      - "tests/test_package_room_designer.py"
      - "src/mojum/room_designer.py"
      - "src/mojum/data/room_designer.html"
      - "tests/test_room_designer_package.py"
      - "tests/room_designer_browser_smoke.cjs"
      - "tests/chrome_startup.cjs"
      - "tests/chrome_startup.test.cjs"
      - "docs/R015_SINGLE_FILE_ROOM_DESIGNER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: single HTML file -> real offline Chromium (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate exact standalone editor without overwriting
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python tools/package_room_designer.py --out ./room-designer-offline.html
          test -s ./room-designer-offline.html
          ! grep -Eiq '<script[[:space:]][^>]*src=' ./room-designer-offline.html
          PYTHONPATH=src python -m mojum.room_designer --output ./room-designer-packaged.html
          cmp ./room-designer-offline.html ./room-designer-packaged.html
      - name: Prove deterministic, exclusive HTML packaging and no journal creation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_package_room_designer.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_room_designer_package.py -v
      - name: Bounded browser startup process regression
        run: node --test tests/chrome_startup.test.cjs
      - name: Browser original and one-file editor through file://
        env:
          MOJUM_ROOM_HTML: room-designer-packaged.html
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BINARY="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BINARY="$(command -v chromium)"
          else
            echo "FAIL: real Chrome required; no silent browser acceptance" >&2
            exit 1
          fi
          node tests/room_designer_browser_smoke.cjs
      - name: Upload non-private phone-width screenshot of bundled HTML
        uses: actions/upload-artifact@v4
        with:
          name: singlefile-room-mobile-${{ matrix.python-version }}
          path: ui-qa-artifacts/room-designer-mobile.png
          if-no-files-found: error
          retention-days: 7
      - name: No-node browser model regression
        run: node --test tests/room_designer_core.test.cjs
