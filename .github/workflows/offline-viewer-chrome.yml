name: Mojum actual offline viewer Chrome smoke

on:
  pull_request:
    paths:
      # Revalidate the real SQLite -> exporter -> Chrome integration whenever
      # its canonical runtime, validation or replay implementation changes.
      - "src/mojum/**"
      - "examples/aquarium_trace_viewer.html"
      - "tests/smoke_real_chromium_viewer.py"
      - "tests/test_private_trace_integrity.py"
      - "tests/test_offline_viewer_playback_controls.py"
      - ".github/workflows/offline-viewer-chrome.yml"
  push:
    branches: [main]
    paths:
      # Revalidate the real SQLite -> exporter -> Chrome integration whenever
      # its canonical runtime, validation or replay implementation changes.
      - "src/mojum/**"
      - "examples/aquarium_trace_viewer.html"
      - "tests/smoke_real_chromium_viewer.py"
      - "tests/test_private_trace_integrity.py"
      - "tests/test_offline_viewer_playback_controls.py"
      - ".github/workflows/offline-viewer-chrome.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate first attempts for a PR while keeping retries and other events independent.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  actual-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require preinstalled real Google Chrome
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium
      - name: Real local SQLite to PRIVATE JSONL to Chrome DOM and canvas
        run: |
          python tests/smoke_real_chromium_viewer.py
