name: Mojum actual offline viewer Chrome smoke

on:
  pull_request:
    paths:
      # The browser tests replay both canonical policy versions from SQLite.
      # Policy/runtime edits must not silently skip the real Chrome gate.
      - "src/mojum/**"
      - "examples/aquarium_trace_viewer.html"
      - "tests/smoke_real_chromium_viewer.py"
      - "src/mojum/aquarium_trace_export.py"
      - ".github/workflows/offline-viewer-chrome.yml"
  push:
    paths:
      - "src/mojum/**"
      - "examples/aquarium_trace_viewer.html"
      - "tests/smoke_real_chromium_viewer.py"
      - "src/mojum/aquarium_trace_export.py"
      - ".github/workflows/offline-viewer-chrome.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require preinstalled real Google Chrome
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium
      - name: Real local SQLite to PRIVATE JSONL to Chrome DOM and canvas
        run: |
          python tests/smoke_real_chromium_viewer.py
