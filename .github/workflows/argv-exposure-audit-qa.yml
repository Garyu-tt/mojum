name: Argv exposure audit QA
on:
  pull_request:
    paths:
      - "src/mojum/argv_exposure_audit.py"
      - "tests/test_argv_exposure_audit.py"
      - ".github/workflows/argv-exposure-audit-qa.yml"
  push:
    branches:
      - "build/1155-argv-exposure-audit-20261123"
    paths:
      - "src/mojum/argv_exposure_audit.py"
      - "tests/test_argv_exposure_audit.py"
      - ".github/workflows/argv-exposure-audit-qa.yml"
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_argv_exposure_audit.py" -v
