name: Mojum explicit v2A-to-v2B fresh-journal transfer QA

on:
  pull_request:
    paths:
      - ".github/workflows/v2a-v2b-transfer.yml"
      - "src/mojum/migration_v2a_v2b.py"
      - "src/mojum/aquarium.py"
      - "src/mojum/noosphere.py"
      - "src/mojum/archived_policy_v2a.py"
      - "src/mojum/local_cell_sense.py"
      - "src/mojum/aquarium_trace_export.py"
      - "src/mojum/cell_policy_v2.py"
      - "tests/test_v2a_v2b_migration.py"
      - "docs/R014_V2A_TO_V2B_NEW_JOURNAL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-source-transfer:
    name: fresh SQLite migration and fail-closed tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout candidate new-journal converter
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact original #112 v2A writer
        uses: actions/checkout@v4
        with:
          repository: Garyu-tt/mojum
          ref: 8d2eaf234c09177ae0b92dfef4bb41950529c912
          path: sources/policy112
          persist-credentials: false
      - name: Checkout exact original #115 v2B writer
        uses: actions/checkout@v4
        with:
          repository: Garyu-tt/mojum
          ref: b755da530634c0d6b8866107e7b4e9e325839175
          path: sources/policy115
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Verify converted experience and original v2B resume
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONWARNINGS: always::ResourceWarning
          MOJUM_ARCHIVE112_SOURCE: sources/policy112
          MOJUM_ARCHIVE115_SOURCE: sources/policy115
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_v2a_v2b_migration.py -v 2>&1 | tee transfer-qa.log
          if grep -q 'ResourceWarning: unclosed database' transfer-qa.log; then
            echo "FAIL: migration leaked SQLite connection" >&2
            exit 1
          fi
