name: Spartan worktree MSYS2 compatibility QA

on:
  pull_request:
    paths:
      - "tools/spartan_worktree.py"
      - "tests/test_spartan_worktree.py"
      - ".github/workflows/spartan-worktree-msys2.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact submitted revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated worktree tests
        run: python -m unittest discover -s tests -p "test_spartan_worktree.py" -v
