name: QA escalation policy

on:
  pull_request:
    paths:
      - "src/mojum/qa_escalation_policy.py"
      - "tests/test_qa_escalation_policy.py"
      - "docs/QA_ESCALATION_POLICY_R01.md"
      - ".github/workflows/qa-escalation-policy.yml"
  push:
    branches: [main]
    paths:
      - "src/mojum/qa_escalation_policy.py"
      - "tests/test_qa_escalation_policy.py"
      - "docs/QA_ESCALATION_POLICY_R01.md"
      - ".github/workflows/qa-escalation-policy.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused regression suite
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_qa_escalation_policy.py' -v
