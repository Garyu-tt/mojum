name: Cloth self-intersection AABB audit
on:
  pull_request:
    paths:
      - "src/mojum/cloth_self_intersection.py"
      - "tests/test_cloth_self_intersection.py"
      - ".github/workflows/cloth-self-intersection-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src/mojum/cloth_self_intersection.py tests/test_cloth_self_intersection.py
      - name: Focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_cloth_self_intersection.py -v
