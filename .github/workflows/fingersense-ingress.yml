name: FingerSense synthetic ingress QA

on:
  pull_request:
    paths:
      - 'src/mojum/fingersense_ingress.py'
      - 'tests/test_fingersense_ingress.py'
      - 'docs/FINGERSENSE_INGRESS_R01.md'
      - '.github/workflows/fingersense-ingress.yml'
  push:
    branches: [main]
    paths:
      - 'src/mojum/fingersense_ingress.py'
      - 'tests/test_fingersense_ingress.py'
      - 'docs/FINGERSENSE_INGRESS_R01.md'
      - '.github/workflows/fingersense-ingress.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused ingress tests
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p 'test_fingersense_ingress.py' -v
