name: Mojum isolated R0.9 curiosity lab QA

on:
  pull_request:
    paths:
      - "src/mojum/sensory_curiosity_lab.py"
      - "tests/test_sensory_curiosity_lab.py"
      - "tests/test_sensory_curiosity_cue_bounds.py"
      - "docs/SENSORY_CURIOSITY_R09.md"
      - "examples/sensory_observer.html"
      - "tests/smoke_r09_chromium_viewer.py"
      - "tests/smoke_real_chromium_viewer.py"
      - ".github/workflows/r09-isolated-curiosity-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-curiosity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Preserve canonical sensory module and check isolated tests
        run: |
          set -euo pipefail
          test -f src/mojum/sensory_play.py
          test -f src/mojum/sensory_curiosity_lab.py
          export PYTHONPATH=src
          python -m unittest discover -s tests -p 'test_sensory_curiosity*.py' -v

  actual-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require actual Chrome and ChromeDriver
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium
          command -v chromedriver
      - name: Real offline R0.9 viewer, local JSONL, desktop and mobile
        run: python tests/smoke_r09_chromium_viewer.py
