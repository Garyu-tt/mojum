name: joint-continuity
on:
  pull_request:
    paths: ["src/mojum/joint_continuity.py", "tests/test_joint_continuity.py", "docs/JOINT_CONTINUITY_R01.md", ".github/workflows/joint-continuity.yml"]
  push:
    branches: [main]
    paths: ["src/mojum/joint_continuity.py", "tests/test_joint_continuity.py", "docs/JOINT_CONTINUITY_R01.md", ".github/workflows/joint-continuity.yml"]
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report runner Python
        run: python3 --version
      - name: Focused tests
        run: PYTHONPATH=src python3 -m unittest tests.test_joint_continuity -v
