name: Spartan lifetime budget private-storage QA

on:
  pull_request:
    paths:
      - 'tools/spartan_budget.py'
      - 'tests/test_spartan_lifetime_budget.py'
      - 'tests/test_spartan_budget_private_storage.py'
      - 'docs/SPARTAN_BUDGET_R01.md'
      - '.github/workflows/spartan-lifetime-budget-storage-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-private-storage:
    name: budget-private-storage (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: ubuntu-24.04
            python-version: '3.13'
          - os: ubuntu-24.04
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run immutable budget and private SQLite regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover -s tests -p 'test_spartan_lifetime_budget.py' -v
          python -m unittest discover -s tests -p 'test_spartan_budget_private_storage.py' -v
