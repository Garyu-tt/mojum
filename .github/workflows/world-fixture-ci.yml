name: World R0.1 independent collision QA
on:
  push:
  pull_request:
jobs:
  world-fixture:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run original and regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_world_room.py' -v
