name: Writer fencing contract

on:
  pull_request:
    paths:
      - "src/mojum/writer_fencing.py"
      - "tests/test_writer_fencing.py"
      - ".github/workflows/writer-fencing.yml"
  push:
    branches:
      - "build/12-writer-fencing-20261123"
    paths:
      - "src/mojum/writer_fencing.py"
      - "tests/test_writer_fencing.py"
      - ".github/workflows/writer-fencing.yml"

permissions:
  contents: read

jobs:
  unittest:
    name: CPython ${{ matrix.python-version }} writer-fencing tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused standard-library tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_writer_fencing.py' -v
