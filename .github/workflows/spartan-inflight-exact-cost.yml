name: Spartan inflight exact cost

on:
  pull_request:
    paths:
      - tools/spartan_inflight_audit.py
      - tests/test_spartan_inflight_audit.py
      - tests/test_spartan_inflight_exact_cost.py
      - .github/workflows/spartan-inflight-exact-cost.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-cost:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.12', '3.14']
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_spartan_inflight_exact_cost.py' -v
      - run: python -m unittest discover -s tests -p 'test_spartan_inflight_audit.py' -v
