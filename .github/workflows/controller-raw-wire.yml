name: Mojum controller raw-wire regression QA

on:
  pull_request:
    paths:
      - ".github/workflows/controller-raw-wire.yml"
      - "tests/test_controller_raw_wire.py"
      - "src/mojum/aquarium.py"
      - "src/mojum/noosphere.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-raw-wire:
    name: strict SQLite controller wire (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify noncanonical raw-wire rejection
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONWARNINGS: always::ResourceWarning
        run: python -m unittest discover -s tests -p test_controller_raw_wire.py -v
