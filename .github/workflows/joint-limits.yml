name: Joint limits QA
on:
  pull_request:
    paths:
      - 'src/mojum/joint_limits.py'
      - 'tests/test_joint_limits.py'
      - 'docs/JOINT_LIMITS_R01.md'
      - '.github/workflows/joint-limits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_joint_limits -v
