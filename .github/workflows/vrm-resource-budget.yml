name: VRM resource budget
on:
  push:
    branches: [qa/1226-vrm-budget-key-bounds-20261124]
  pull_request:
    paths:
      - "src/mojum/vrm_resource_budget.py"
      - "tests/test_vrm_resource_budget.py"
      - "docs/VRM_RESOURCE_BUDGET_R01.md"
      - ".github/workflows/vrm-resource-budget.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_vrm_resource_budget.py -v
      - name: Compile module
        run: python -m py_compile src/mojum/vrm_resource_budget.py
