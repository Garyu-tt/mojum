name: world-humidity
on:
  push:
    branches: ["build/7-world-humidity-20261124"]
  pull_request:
    paths:
      - "src/mojum/world_humidity.py"
      - "tests/test_world_humidity.py"
      - "docs/WORLD_HUMIDITY_R01.md"
      - ".github/workflows/world-humidity.yml"
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile focused source and tests
        run: python -m compileall -q src/mojum/world_humidity.py tests/test_world_humidity.py
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_world_humidity -v
