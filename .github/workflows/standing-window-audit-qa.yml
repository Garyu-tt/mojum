name: Mojum standing-window candidate exact-head QA

on:
  pull_request:
    paths:
      - 'src/mojum/standing_window_audit.py'
      - 'src/mojum/physics_observation.py'
      - 'tests/test_standing_window_audit.py'
      - '.github/workflows/standing-window-audit-qa.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  standing-window-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert actual PR head checkout
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Run all standing-window focused acceptance tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_standing_window_audit.py' -v
