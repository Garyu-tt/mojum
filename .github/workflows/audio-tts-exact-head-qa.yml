name: Audio TTS exact-head contract QA

on:
  pull_request:
    paths:
      - "src/mojum/audio_tts.py"
      - "tests/test_audio_tts.py"
      - ".github/workflows/audio-tts-exact-head-qa.yml"
  push:
    paths:
      - "src/mojum/audio_tts.py"
      - "tests/test_audio_tts.py"
      - ".github/workflows/audio-tts-exact-head-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tts-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run TTS contract regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_audio_tts.py -v
