name: OpenXR hand observation (offline)

on:
  pull_request:
    paths:
      - 'src/mojum/openxr_hand.py'
      - 'tests/test_openxr_hand.py'
      - 'docs/OPENXR_HAND_OBSERVATION_R01.md'
      - '.github/workflows/openxr-hand-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-openxr-hand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate offline OpenXR hand boundary
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_openxr_hand.py -v
