name: Core graph extraction
on:
  pull_request:
    branches: [core/v2]
  push:
    branches: [core/v2]
permissions:
  contents: read
jobs:
  graph-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 074b14c152c8c5e3291e6e56595255386a751af9
          path: legacy
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Differential extraction tests
        env:
          PYTHONPATH: src:legacy/src
        run: python -m unittest discover -s tests -v
