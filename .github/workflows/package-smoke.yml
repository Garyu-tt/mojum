name: Mojum installed-wheel synthetic aquarium smoke

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/mojum/**'
      - 'tests/offline_package_smoke.sh'
      - 'tests/test_installable_package.py'
      - '.github/workflows/package-smoke.yml'
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  # Deduplicate first attempts for a PR while keeping retries and other events independent.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  installed-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provision the wheel builder
        run: python -m pip install 'setuptools>=77.0.3' wheel
      - name: Rebuild, install and resume in a network namespace with only loopback
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          source_epoch=$(git show -s --format=%ct HEAD)
          staging=$(mktemp -d "$RUNNER_TEMP/mojum-wheel-source.XXXXXX")
          git archive --format=tar --output="$staging/source.tar" HEAD
          for source in "$staging/first" "$staging/second"; do
            mkdir -- "$source"
            tar -xf "$staging/source.tar" -C "$source"
          done
          sudo unshare --net -- sudo -u "$(id -un)" -- env \
            "PATH=$PATH" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            "SOURCE_DATE_EPOCH=$source_epoch" \
            bash "$staging/first/tests/offline_package_smoke.sh" \
            "$RUNNER_TEMP/mojum-wheel-smoke" "$staging/second" "$RELEASE_TAG"
          cd "$RUNNER_TEMP/mojum-wheel-smoke/wheels"
          sha256sum mojum-*.whl > SHA256SUMS
      - name: Save the verified release wheel
        if: github.ref_type == 'tag' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: mojum-release-wheel
          path: |
            ${{ runner.temp }}/mojum-wheel-smoke/wheels/mojum-*.whl
            ${{ runner.temp }}/mojum-wheel-smoke/wheels/SHA256SUMS
          if-no-files-found: error
