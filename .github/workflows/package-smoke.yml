name: Mojum installed-wheel synthetic aquarium smoke

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/mojum/**'
      - 'tests/offline_package_smoke.sh'
      - 'tests/test_installable_package.py'
      - '.github/workflows/package-smoke.yml'

permissions:
  contents: read

concurrency:
  # Deduplicate first attempts for a PR while keeping retries and other events independent.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  installed-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provision the wheel builder
        run: python -m pip install 'setuptools>=61' wheel
      - name: Build, install and resume in a network namespace with only loopback
        shell: bash
        run: |
          sudo unshare --net -- sudo -u "$(id -un)" -- env \
            "PATH=$PATH" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            bash tests/offline_package_smoke.sh "$RUNNER_TEMP/mojum-wheel-smoke"

  # Keep optional adapter QA in a workflow already registered on main.
  # A brand-new workflow introduced by this PR does not reliably run premerge.
  optional-gymnasium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated optional test dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: 'numpy==2.3.5' 'gymnasium==1.4.0'
      - name: Exercise Gymnasium spaces, reset and step
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_point_room_env tests.test_gymnasium_adapter -v
      - name: Validate Gymnasium API compatibility
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from gymnasium.utils.env_checker import check_env
          from mojum.gymnasium_adapter import make_gymnasium_point_room
          from mojum.world_room import Room
          env = make_gymnasium_point_room(Room(4, 4), start=(1, 1), max_steps=16)
          check_env(env, skip_render_check=True)
          env.close()
          PY
