name: Cloth scheduling focused tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mojum/cloth_schedule.py"
      - "tests/test_cloth_schedule.py"
      - ".github/workflows/cloth-schedule.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile module
        run: python -m py_compile src/mojum/cloth_schedule.py
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cloth_schedule.py' -v
