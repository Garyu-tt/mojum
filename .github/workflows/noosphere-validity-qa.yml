name: Noosphere validity audit QA

on:
  pull_request:
    paths:
      - "src/mojum/noosphere_validity.py"
      - "tests/test_noosphere_validity.py"
      - ".github/workflows/noosphere-validity-qa.yml"
  push:
    branches:
      - "qa/1075-value-tree-budget-20261123"
    paths:
      - "src/mojum/noosphere_validity.py"
      - "tests/test_noosphere_validity.py"
      - ".github/workflows/noosphere-validity-qa.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    name: CPython ${{ matrix.python-version }} validity audit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Compile implementation and tests
        env:
          PYTHONPATH: src
        run: python -m py_compile src/mojum/noosphere_validity.py tests/test_noosphere_validity.py
      - name: Run focused standard-library tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_noosphere_validity.py' -v
