name: Mojum GGUF artifact checker portability

on:
  pull_request:
    paths:
      - "tools/gpu_legion_artifact_check.py"
      - "tests/test_gpu_legion_artifact_check.py"
      - ".github/workflows/gpu-legion-artifact-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-portability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused offline artifact tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -p test_gpu_legion_artifact_check.py -v
