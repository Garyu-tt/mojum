name: Genesis ledger pilot
on:
  pull_request:
    branches: [plugin/genesis-ledger, dev/genesis-ledger/extract-r01]
  push:
    branches: [plugin/genesis-ledger]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          actual=$(git rev-parse HEAD)
          printf "Expected: %s\nActual: %s\n" "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Standalone exact-head contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Checkout proposed merge for compatibility
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify proposed merge and run contract tests
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PYTHONPATH: src
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m unittest discover -s tests -v
