name: SB3 point-room optional CPU smoke

on:
  pull_request:
    paths:
      - 'src/mojum/sb3_room_baseline.py'
      - 'tests/test_sb3_room_baseline.py'
      - 'docs/SB3_ROOM_BASELINE_R01.md'
      - '.github/workflows/sb3-point-room-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sb3-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only optional runtime
        run: |
          python -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'gymnasium==1.2.2' 'stable-baselines3==2.7.0'
      - name: Run stdlib CPU regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_sb3_room_baseline.py' -v
      - name: Run optional real Gymnasium checker and bounded PPO
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          from gymnasium.utils.env_checker import check_env
          from mojum.sb3_room_baseline import TRAIN
          from mojum.gym_room import make_gymnasium_env
          for scene in TRAIN:
              env = make_gymnasium_env(
                  scene.room, start=scene.start, goal=scene.goal, max_steps=64
              )
              try:
                  check_env(env, skip_render_check=True)
              finally:
                  env.close()
          PY
          python -m mojum.sb3_room_baseline \
            --mode sb3 --seed 7 --train-timesteps 64
