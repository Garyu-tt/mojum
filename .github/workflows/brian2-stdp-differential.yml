name: Brian2 STDP differential (opt-in)

on:
  pull_request:
    paths:
      - 'src/mojum/brian2_stdp.py'
      - 'tests/test_brian2_stdp.py'
      - 'docs/BRIAN2_STDP_DIFFERENTIAL_R01.md'
      - '.github/workflows/brian2-stdp-differential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head or manual dispatch SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline reference without dependencies
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_brian2_stdp.py' -v

  native-brian2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head or manual dispatch SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned compatible NumPy and optional Brian2
        run: |
          python -m pip install 'numpy==1.26.4' 'brian2==2.9.0'
          python -c 'import numpy, brian2; assert numpy.__version__ == "1.26.4" and brian2.__version__ == "2.9.0"'
      - name: Test actual Brian2 numerical differential without silent skip
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_brian2_stdp.py' -v 2>&1 | tee /tmp/brian2-stdp-native.log
          if grep -Eq 'skipped.*native Brian2 optional' /tmp/brian2-stdp-native.log; then exit 1; fi
