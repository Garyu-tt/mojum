name: Spartan Langfuse OTLP opt-in QA

on:
  pull_request:
    paths:
      - 'tools/spartan_langfuse_trace.py'
      - 'tests/test_spartan_langfuse_trace.py'
      - 'docs/SPARTAN_LANGFUSE_OTLP_R01.md'
      - '.github/workflows/spartan-langfuse-otlp-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-privacy-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact PR HEAD checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline privacy, resource and fail-closed regression
        run: python -m unittest discover -s tests -p 'test_spartan_langfuse_trace.py' -v
      - name: Syntax check
        run: python -m compileall -q tools/spartan_langfuse_trace.py tests/test_spartan_langfuse_trace.py
