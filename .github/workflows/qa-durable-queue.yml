name: QA durable queue
on:
  pull_request:
    paths:
      - "src/mojum/qa_queue.py"
      - "tests/test_qa_queue.py"
      - "docs/QA_QUEUE_R01.md"
      - ".github/workflows/qa-durable-queue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile queue module
        run: python -m py_compile src/mojum/qa_queue.py
      - name: Run focused queue contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_qa_queue.py" -v
