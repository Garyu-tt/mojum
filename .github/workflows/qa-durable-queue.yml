name: QA durable queue
on:
  pull_request:
    paths:
      - "src/mojum/qa_queue.py"
      - "tests/test_qa_queue.py"
      - "docs/QA_QUEUE_R01.md"
      - ".github/workflows/qa-durable-queue.yml"
  push:
    branches:
      - "qa/1191-close-task-queue-connections-20261123"
    paths:
      - "src/mojum/qa_queue.py"
      - "tests/test_qa_queue.py"
      - "docs/QA_QUEUE_R01.md"
      - ".github/workflows/qa-durable-queue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile queue module
        run: python -m py_compile src/mojum/qa_queue.py
      - name: Run focused queue contract and resource-warning audit
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error::ResourceWarning
        run: python -X dev -m unittest discover -s tests -p "test_qa_queue.py" -v
