name: School artifact review

on:
  pull_request:
    paths:
      - "src/mojum/school_artifact_review.py"
      - "tests/test_school_artifact_review.py"
      - "docs/SCHOOL_ARTIFACT_REVIEW_R01.md"
      - ".github/workflows/school-artifact-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused school artifact review tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_school_artifact_review.py" -v
      - name: Run existing school activity regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_school_activity.py" -v
