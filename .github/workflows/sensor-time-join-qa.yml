name: Sensor time-join exact-head QA

on:
  pull_request:
    paths:
      - 'src/mojum/sensor_time_join.py'
      - 'tests/test_sensor_time_join.py'
      - '.github/workflows/sensor-time-join-qa.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  sensor-time-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact PR HEAD
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Run synthetic sensor time-join tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_sensor_time_join.py' -v
