name: Planar kinematics reference

on:
  pull_request:
    paths:
      - ".github/workflows/planar-kinematics-reference.yml"
      - "src/mojum/planar_kinematics_reference.py"
      - "tests/test_planar_kinematics_reference.py"
      - "tools/planar_kinematics_reference.py"
      - "docs/PLANAR_KINEMATICS_REFERENCE_R01.md"
  push:
    branches:
      - "build/702-planar-kinematics-reference-20261124-0500"
    paths:
      - ".github/workflows/planar-kinematics-reference.yml"
      - "src/mojum/planar_kinematics_reference.py"
      - "tests/test_planar_kinematics_reference.py"
      - "tools/planar_kinematics_reference.py"
      - "docs/PLANAR_KINEMATICS_REFERENCE_R01.md"

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_planar_kinematics_reference.py" -v
      - name: Run deterministic CLI smoke
        run: python tools/planar_kinematics_reference.py
