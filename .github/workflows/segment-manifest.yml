name: Segment manifest contract

on:
  pull_request:
    paths:
      - "src/mojum/segment_manifest.py"
      - "tests/test_segment_manifest.py"
      - "docs/SEGMENT_MANIFEST_R01.md"
      - ".github/workflows/segment-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segment-manifest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run hermetic segment manifest tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_segment_manifest.py" -v
