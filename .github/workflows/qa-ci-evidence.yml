name: QA CI evidence evaluator
on:
  pull_request:
    paths:
      - "src/mojum/qa_ci_evidence.py"
      - "tests/test_qa_ci_evidence.py"
      - "docs/QA_CI_EVIDENCE_R01.md"
      - ".github/workflows/qa-ci-evidence.yml"
  push:
    branches: ["build/**"]
    paths:
      - "src/mojum/qa_ci_evidence.py"
      - "tests/test_qa_ci_evidence.py"
      - "docs/QA_CI_EVIDENCE_R01.md"
      - ".github/workflows/qa-ci-evidence.yml"
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact checked-out commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run focused contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_qa_ci_evidence.py" -v
