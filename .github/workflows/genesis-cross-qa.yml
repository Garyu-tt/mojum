name: GENESIS synthetic founder-cross QA

on:
  pull_request:
    paths:
      - "src/mojum/genesis.py"
      - "src/mojum/genesis_cross.py"
      - "tests/test_genesis_cross.py"
      - ".github/workflows/genesis-cross-qa.yml"

permissions:
  contents: read

jobs:
  genesis-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run deterministic GENESIS crossing tests
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests.test_genesis_cross
