name: Spartan provider capacity matrix QA

on:
  pull_request:
    paths:
      - 'tools/spartan_provider_matrix.py'
      - 'tests/test_spartan_provider_matrix.py'
      - 'examples/spartan_provider_matrix.synthetic.json'
      - 'docs/SPARTAN_PROVIDER_MATRIX_R01.md'
      - '.github/workflows/spartan-provider-matrix-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Deterministic offline capacity matrix regression
        run: python -m unittest discover -s tests -p test_spartan_provider_matrix.py -v
      - name: Offline CLI smoke on synthetic-only input
        run: >-
          python tools/spartan_provider_matrix.py
          --snapshot examples/spartan_provider_matrix.synthetic.json
          --worker-leases 300 --ram-mib 16384 --vram-mib 0
          --tokens 16384 --micro-usd 0
          --prompt-tokens 256 --completion-tokens 256
          --window-seconds 10 --max-retries 0
