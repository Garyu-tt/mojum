name: Graph v1 information-flow audit QA

on:
  pull_request:
    paths:
      - "src/mojum/graph_v1_flow_audit.py"
      - "tests/test_graph_v1_flow_audit.py"
      - "docs/GRAPH_V1_FLOW_AUDIT_R01.md"
      - ".github/workflows/graph-v1-flow-audit.yml"
  push:
    branches:
      - "qa/**"
    paths:
      - "src/mojum/graph_v1_flow_audit.py"
      - "tests/test_graph_v1_flow_audit.py"
      - "docs/GRAPH_V1_FLOW_AUDIT_R01.md"
      - ".github/workflows/graph-v1-flow-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-v1-flow-audit-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: CPython ${{ matrix.python-version }} exact-head focused tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert checked out head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run focused regression suite
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error
        run: python -m unittest discover -s tests -p "test_graph_v1_flow_audit.py" -v
