name: Spartan retry policy exact-head QA

on:
  pull_request:
    paths:
      - "src/mojum/spartan_retry_policy.py"
      - "tests/test_spartan_retry_policy.py"
      - ".github/workflows/spartan-retry-policy-qa.yml"
  push:
    paths:
      - "src/mojum/spartan_retry_policy.py"
      - "tests/test_spartan_retry_policy.py"
      - ".github/workflows/spartan-retry-policy-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Spartan retry policy contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_spartan_retry_policy.py -v
