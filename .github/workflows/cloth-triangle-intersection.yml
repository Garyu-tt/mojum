name: Cloth triangle intersection QA

on:
  pull_request:
    paths:
      - "src/mojum/cloth_triangle_intersection.py"
      - "tests/test_cloth_triangle_intersection.py"
      - "docs/CLOTH_TRIANGLE_INTERSECTION_R01.md"
      - ".github/workflows/cloth-triangle-intersection.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cloth_triangle_intersection.py' -v
      - name: Compile
        run: python -m compileall -q src/mojum/cloth_triangle_intersection.py
