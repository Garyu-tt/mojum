name: Noosphere source-consent QA

on:
  pull_request:
    paths:
      - ".github/workflows/noosphere-consent-qa.yml"
      - "src/mojum/noosphere_consent.py"
      - "tests/test_noosphere_consent.py"
  push:
    branches:
      - "build/**"
      - "qa/**"
    paths:
      - ".github/workflows/noosphere-consent-qa.yml"
      - "src/mojum/noosphere_consent.py"
      - "tests/test_noosphere_consent.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact revision
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Run source-consent regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_noosphere_consent.py" -v
