name: Mojum neutral-probe negative-control QA

on:
  pull_request:
    paths:
      - ".github/workflows/neutral-probe-control.yml"
      - "src/mojum/neutral_probe_trial.py"
      - "tests/test_neutral_probe_trial.py"
      - "src/mojum/developmental_policy.py"
      - "src/mojum/world_room.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify deterministic neutral-probe arm and frozen control
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_neutral_probe_trial.py -v
      - name: Inspect bounded synthetic CLI summary
        env:
          PYTHONPATH: src
        run: python -m mojum.neutral_probe_trial --ticks 120 --mode compare
