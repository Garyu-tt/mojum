name: GENESIS attribution traversal QA

on:
  pull_request:
    paths:
      - "src/mojum/genesis_attribution.py"
      - "tests/test_genesis_attribution*.py"
      - ".github/workflows/genesis-attribution-qa.yml"
  push:
    branches:
      - main
      - "qa/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused GENESIS attribution tests
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/mojum/genesis_attribution.py
          python -m unittest discover -s tests -p 'test_genesis_attribution*.py' -v
