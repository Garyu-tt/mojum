name: Mojum R0.16 PRIVATE trace pinned-dirfd publication race QA

on:
  pull_request:
    paths:
      - ".github/workflows/r016-private-dirfd-publish.yml"
      - "src/mojum/aquarium_trace_export.py"
      - "tests/test_r016_private_dirfd_publish.py"
      - "tests/test_r016_export_crash_atomicity.py"
  push:
    paths:
      - ".github/workflows/r016-private-dirfd-publish.yml"
      - "src/mojum/aquarium_trace_export.py"
      - "tests/test_r016_private_dirfd_publish.py"
      - "tests/test_r016_export_crash_atomicity.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojum-r016-dirfd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-directory-publish:
    name: pinned-dirfd (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Real PRIVATE segmented SQLite and adversarial POSIX dirfd publication
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_r016_*.py' -v
