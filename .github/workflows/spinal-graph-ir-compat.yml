name: spinal-graph-ir-compat

on:
  push:
    paths:
      - "tools/spinal_graph_ir_compat.py"
      - "tests/test_spinal_graph_ir_compat.py"
      - ".github/workflows/spinal-graph-ir-compat.yml"
  pull_request:
    paths:
      - "tools/spinal_graph_ir_compat.py"
      - "tests/test_spinal_graph_ir_compat.py"
      - ".github/workflows/spinal-graph-ir-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused compatibility tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_spinal_graph_ir_compat.py -v
      - name: Run deterministic CLI smoke
        env:
          PYTHONPATH: src
        run: python tools/spinal_graph_ir_compat.py --revision 17
