name: Spartan coordinator connection cleanup

on:
  pull_request:
    paths:
      - tools/spartan_coordinator.py
      - tests/test_spartan_coordinator*.py
      - .github/workflows/spartan-coordinator-connect-cleanup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinator-cleanup:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.12', '3.14']
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify constructor cleanup and dispatcher contracts
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_spartan_coordinator*.py' -v
