name: Mojum external-agent heartbeat receipt QA

on:
  pull_request:
    paths:
      - src/mojum/external_agent_heartbeat.py
      - tests/test_external_agent_heartbeat.py
      - docs/EXTERNAL_AGENT_HEARTBEAT_R01.md
      - .github/workflows/external-agent-heartbeat-qa.yml
  push:
    branches: [main]
    paths:
      - src/mojum/external_agent_heartbeat.py
      - tests/test_external_agent_heartbeat.py
      - .github/workflows/external-agent-heartbeat-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-receipt-unittest:
    name: External receipts / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run signed-receipt offline tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_external_agent_heartbeat.py' -v
