name: PFD acceptance audit
on:
  pull_request:
    branches: [dev/pfd-r01]
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  acceptance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact auditor revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          actual=$(git rev-parse HEAD)
          printf "Expected: %s\nActual: %s\n" "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"
      - run: python -c "import sys, unittest; suite = unittest.defaultTestLoader.discover(sys.argv[1], pattern=sys.argv[2]); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.wasSuccessful() and result.testsRun > len(result.skipped) + len(result.expectedFailures) else 1)" tests 'test_pfd*.py'
      - run: python tools/pfd_migration_audit.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Checkout proposed merge for compatibility
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify proposed merge and run PFD unit tests
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -c "import sys, unittest; suite = unittest.defaultTestLoader.discover(sys.argv[1], pattern=sys.argv[2]); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.wasSuccessful() and result.testsRun > len(result.skipped) + len(result.expectedFailures) else 1)" tests 'test_pfd*.py'
