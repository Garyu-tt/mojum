name: Kinematics evaluator

on:
  pull_request:
    paths:
      - ".github/workflows/kinematics-evaluator.yml"
      - "src/mojum/kinematics_evaluator.py"
      - "tests/test_kinematics_evaluator.py"
      - "docs/KINEMATICS_EVALUATOR_R01.md"
  push:
    branches:
      - "build/702-kinematics-benchmark-20261124"
    paths:
      - ".github/workflows/kinematics-evaluator.yml"
      - "src/mojum/kinematics_evaluator.py"
      - "tests/test_kinematics_evaluator.py"
      - "docs/KINEMATICS_EVALUATOR_R01.md"

permissions:
  contents: read

jobs:
  evaluator-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_kinematics_evaluator.py" -v
