name: Cezar Telegram read-only replacement QA
on:
  pull_request:
    paths:
      - 'ops/cezar/telegram/**'
      - 'docs/CEZAR_TELEGRAM_R01.md'
      - '.github/workflows/cezar-telegram-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-only-and-no-replay:
    name: Telegram bot + gateway (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Owner, replay, read-only gateway and no-GitHub-write tests
        run: python -m unittest discover -s ops/cezar/telegram -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q ops/cezar/telegram
