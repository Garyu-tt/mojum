name: Spartan isolated worktree independent QA

on:
  pull_request:
    paths:
      - 'tools/spartan_worktree.py'
      - 'tests/test_spartan_worktree.py'
      - '.github/workflows/spartan-worktree-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Old reruns cannot cancel checks for the latest PR head.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  isolated-worktree:
    name: isolated-worktree (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run hermetic git worktree and path-isolation regressions
        run: python -m unittest discover -s tests -p 'test_spartan_worktree.py' -v
