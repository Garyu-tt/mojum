name: Mojum R0.15 portable-host v4 acceptance

on:
  pull_request:
    branches:
      - main
      - codex/r015-local-cell-v4-epoch-forward-port
    paths:
      - .github/workflows/r015-portable-host-v4-qa.yml
      - src/mojum/portable_host.py
      - tests/test_portable_host_v4.py
      - tests/test_portable_host.py
      - src/mojum/aquarium.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-host-v4:
    name: portable host v4 Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Legacy and epoch portable-host acceptance regressions
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_portable_host*.py' -v
