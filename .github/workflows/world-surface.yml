name: world-surface
on:
  push:
    branches: ["build/7-world-surface-20261124"]
  pull_request:
    paths:
      - "src/mojum/world_surface.py"
      - "tests/test_world_surface.py"
      - "docs/WORLD_SURFACE_R01.md"
      - ".github/workflows/world-surface.yml"
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest tests.test_world_surface -v
        env:
          PYTHONPATH: src
