name: virtual-mass-properties

on:
  pull_request:
    paths:
      - "src/mojum/virtual_mass_properties.py"
      - "tests/test_virtual_mass_properties.py"
      - "docs/VIRTUAL_MASS_PROPERTIES_R01.md"
      - ".github/workflows/virtual-mass-properties.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    name: Python ${{ matrix.python-version }} focused contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Assert exact submitted revision
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile changed Python files
        run: python -m compileall -q src/mojum/virtual_mass_properties.py tests/test_virtual_mass_properties.py
      - name: Run focused regressions
        env:
          PYTHONPATH: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_virtual_mass_properties.py' -v
