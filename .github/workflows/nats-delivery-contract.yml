name: NATS delivery contract QA

on:
  push:
    paths:
      - "src/mojum/nats_delivery_contract.py"
      - "tests/test_nats_delivery_contract.py"
      - ".github/workflows/nats-delivery-contract.yml"
  pull_request:
    paths:
      - "src/mojum/nats_delivery_contract.py"
      - "tests/test_nats_delivery_contract.py"
      - ".github/workflows/nats-delivery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested revision
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_nats_delivery_contract.py' -v
