name: External agent ingress admission limit

on:
  pull_request:
    paths:
      - "src/mojum/external_agent_ingress_limit.py"
      - "tests/test_external_agent_ingress_limit.py"
      - "docs/EXTERNAL_AGENT_INGRESS_LIMIT_R01.md"
      - ".github/workflows/external-agent-ingress-limit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src/mojum/external_agent_ingress_limit.py tests/test_external_agent_ingress_limit.py
      - name: Focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_external_agent_ingress_limit.py -v
