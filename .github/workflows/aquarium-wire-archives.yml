name: Mojum read-only Aquarium policy ABI

on:
  pull_request:
    paths:
      - 'src/mojum/aquarium.py'
      - 'src/mojum/aquarium_wire.py'
      - 'src/mojum/noosphere.py'
      - 'src/mojum/developmental.py'
      - 'tests/test_aquarium_wire.py'
      - 'tests/qa_aquarium_wire_archives.py'
      - '.github/workflows/aquarium-wire-archives.yml'

permissions:
  contents: read

concurrency:
  # Keep only the latest PR head's CI. Never cancel manual or main runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive-policy-identification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8d2eaf234c09177ae0b92dfef4bb41950529c912
          path: archive-sources/v2a
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b755da530634c0d6b8866107e7b4e9e325839175
          path: archive-sources/v2b
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fe031d9217948ec5c56cb52bfeaad04319221e8b
          path: archive-sources/guided
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify actual archived policies without writing to their SQLite files
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tests/qa_aquarium_wire_archives.py --source-a archive-sources/v2a \
            --source-b archive-sources/v2b --source-guided archive-sources/guided
