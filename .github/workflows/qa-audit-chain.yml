name: QA supervisor audit-chain contract
on:
  pull_request:
    paths:
      - "src/mojum/qa_audit_chain.py"
      - "tests/test_qa_audit_chain.py"
      - "docs/QA_AUDIT_CHAIN_R01.md"
      - ".github/workflows/qa-audit-chain.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused regression
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_qa_audit_chain.py' -v
