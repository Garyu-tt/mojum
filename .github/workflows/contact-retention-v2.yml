name: contact-retention-v2
on:
  push:
    paths:
      - "src/mojum/contact_retention_v2.py"
      - "tests/test_contact_retention_v2.py"
      - ".github/workflows/contact-retention-v2.yml"
  pull_request:
    paths:
      - "src/mojum/contact_retention_v2.py"
      - "tests/test_contact_retention_v2.py"
      - ".github/workflows/contact-retention-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_contact_retention_v2.py" -v
