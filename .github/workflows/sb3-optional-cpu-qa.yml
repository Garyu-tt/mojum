name: Optional SB3 held-out CPU integration

on:
  pull_request:
    paths:
      - 'src/mojum/sb3_benchmark.py'
      - 'tests/test_sb3_benchmark.py'
      - 'docs/INTEGRATION_SB3_BASELINE_R01.md'
      - '.github/workflows/sb3-optional-cpu-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sb3-optional-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  frozen-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR HEAD checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Deterministic frozen control and negative cases, zero extra deps
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_sb3_benchmark.py' -v
          python -m mojum.sb3_benchmark

  native-pinned-cpu:
    needs: frozen-stdlib
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR HEAD checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only PyTorch and optional upstream
        run: |
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          python -m pip install --no-cache-dir 'stable-baselines3==2.9.2' 'gymnasium==1.3.0'
      - name: Assert exact dependency versions and CPU backend
        run: |
          python - <<'PY'
          import torch
          from importlib.metadata import version
          assert version("stable-baselines3") == "2.9.2"
          assert version("gymnasium") == "1.3.0"
          assert torch.__version__.startswith("2.9.1")
          assert not torch.cuda.is_available()
          PY
      - name: Native SB3 PPO 128-step bounded headless smoke
        run: python -m mojum.sb3_benchmark --native-sb3 --timesteps 128 --policy-seed 2026
