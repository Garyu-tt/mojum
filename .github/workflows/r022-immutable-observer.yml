name: Mojum R0.22 immutable owner-verified Aquarium history observer

on:
  pull_request:
    paths:
      - ".github/workflows/r022-immutable-observer.yml"
      - "src/mojum/quarantined_observer.py"
      - "src/mojum/segment_archive_cli.py"
      - "tests/test_quarantined_observer.py"
      - "docs/R022_QUARANTINED_OBSERVER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Owner-HMAC anchored SQLite immutable observer and default PRIVATE redaction
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_quarantined_observer.py -v
      - name: Re-verify source cold recovery and immutable custody protections
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_verified_replica_restore.py -v
