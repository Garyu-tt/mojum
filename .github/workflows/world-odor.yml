name: world-odor
on:
  pull_request:
    paths:
      - "src/mojum/world_odor.py"
      - "tests/test_world_odor.py"
      - "docs/WORLD_ODOR_R01.md"
      - ".github/workflows/world-odor.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p "test_world_odor.py" -v
