name: QA workflow evidence
on:
  pull_request:
    paths:
      - "src/mojum/qa_workflow_evidence.py"
      - "tests/test_qa_workflow_evidence.py"
      - ".github/workflows/qa-workflow-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout is the event HEAD
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile src/mojum/qa_workflow_evidence.py tests/test_qa_workflow_evidence.py
      - name: Focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_qa_workflow_evidence.py' -v
