name: World reachability mapping-key QA

on:
  pull_request:
    paths:
      - "src/mojum/world_reachability.py"
      - "tests/test_world_reachability.py"
      - ".github/workflows/world-reachability-mapping-keys.yml"
  push:
    branches:
      - "qa/820-native-mapping-keys-reintegration-20261126"
    paths:
      - "src/mojum/world_reachability.py"
      - "tests/test_world_reachability.py"
      - ".github/workflows/world-reachability-mapping-keys.yml"

permissions:
  contents: read

concurrency:
  group: world-reachability-mapping-keys-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and regression tests
        run: python -m compileall -q src/mojum/world_reachability.py tests/test_world_reachability.py
      - name: Run focused regression suite
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_world_reachability.py" -v
