name: Trace sanitizer QA

on:
  pull_request:
    paths:
      - "src/mojum/trace_sanitize.py"
      - "tests/test_trace_sanitize.py"
      - "docs/TRACE_SANITIZE_R01.md"
      - ".github/workflows/trace-sanitize-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile src/mojum/trace_sanitize.py
      - name: Focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_trace_sanitize.py -v
