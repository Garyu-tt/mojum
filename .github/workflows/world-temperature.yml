name: world-temperature
on:
  pull_request:
    paths:
      - "src/mojum/world_temperature.py"
      - "tests/test_world_temperature.py"
      - "docs/WORLD_TEMPERATURE_R01.md"
      - ".github/workflows/world-temperature.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m unittest discover -s tests -p "test_world_temperature.py" -v
        env:
          PYTHONPATH: src
