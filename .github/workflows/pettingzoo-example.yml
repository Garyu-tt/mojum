name: PettingZoo offline example

on:
  pull_request:
    paths:
      - "examples/pettingzoo/**"
      - "tests/test_pettingzoo_example.py"
      - "docs/PETTINGZOO_EXAMPLE_R01.md"
      - ".github/workflows/pettingzoo-example.yml"
  push:
    branches: [main]
    paths:
      - "examples/pettingzoo/**"
      - "tests/test_pettingzoo_example.py"
      - "docs/PETTINGZOO_EXAMPLE_R01.md"
      - ".github/workflows/pettingzoo-example.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -p test_pettingzoo_example.py -v
      - name: Run bounded benchmark smoke
        run: python examples/pettingzoo/benchmark.py --seed 10 --episodes 4 --horizon 6
