name: Diagnostic SQLite allocation trace (Python 3.13)

# Opt-in CI probe for issue #121. Runs only when its own workflow changes or
# when explicitly dispatched. Not part of every PR's fast quality gate.
on:
  pull_request:
    paths:
      - '.github/workflows/sqlite-allocation-trace-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-allocation-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # pull_request's default checkout is the synthetic merge ref. Inspect
      # exactly the reviewed source head; use the selected ref for dispatch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Capture actual allocation traceback for deferred SQLite ResourceWarnings
        env:
          PYTHONPATH: src
          MOJUM_EPOCH_V4_STRESS: '1'
          PYTHONTRACEMALLOC: '1'
          PYTHONWARNINGS: 'default::ResourceWarning'
        run: |
          python -m compileall -q src tests
          python tests/audit_sqlite_resource_warnings.py
