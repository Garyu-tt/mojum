name: Spartan Provider Admission independent QA

on:
  pull_request:
    paths:
      - 'tools/spartan_provider_admission.py'
      - 'tests/test_spartan_provider_admission.py'
      - 'docs/SPARTAN_PROVIDER_ADMISSION_R01.md'
      - '.github/workflows/spartan-provider-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-provider-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile tools/spartan_provider_admission.py tests/test_spartan_provider_admission.py
      - name: Offline provider admission and localhost mock
        env:
          PYTHONPATH: .
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p 'test_spartan_provider_admission.py' -v
