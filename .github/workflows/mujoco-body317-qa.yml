name: Mojum opt-in MuJoCo body 3.17 native QA

on:
  pull_request:
    paths:
      - 'src/mojum/mujoco_body.py'
      - 'tests/test_mujoco_body.py'
      - 'docs/MUJOCO_BODY_R01.md'
      - '.github/workflows/mujoco-body317-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  native-mujoco-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install strictly pinned optional real solver
        run: python -m pip install --disable-pip-version-check 'mujoco==3.17.0'
      - name: Run contract and REAL solver deterministic replay tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_mujoco_body.py' -v
          python -m mojum.mujoco_body --benchmark --steps 100 --warmup 10
