name: Cloth contact telemetry

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mojum/cloth_contact_telemetry.py"
      - "tests/test_cloth_contact_telemetry.py"
      - "docs/CLOTH_CONTACT_TELEMETRY_R01.md"
      - ".github/workflows/cloth-contact-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloth-contact-telemetry-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  synthetic-contact-telemetry:
    name: Python ${{ matrix.python-version }} / stdlib reducer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile the implementation and tests
        run: python -m compileall -q src/mojum/cloth_contact_telemetry.py tests/test_cloth_contact_telemetry.py
      - name: Run focused offline regressions
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cloth_contact_telemetry.py' -v
      - name: Verify the installed package exposes the opt-in utility
        run: |
          python -m pip install --no-deps .
          python -c "from mojum.cloth_contact_telemetry import SCHEMA; assert SCHEMA == 'mojum.cloth.contact-telemetry/1'"
