name: dm_control benchmark probe

on:
  pull_request:
    paths:
      - "src/mojum/dm_control_benchmark.py"
      - "tests/test_dm_control_benchmark.py"
      - "docs/DM_CONTROL_BENCHMARK_R01.md"
      - ".github/workflows/dm-control-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_dm_control_benchmark.py' -v

  native-dm-control:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned optional benchmark dependency
        run: python -m pip install --disable-pip-version-check "dm-control==1.0.52"
      - name: Run native headless MuJoCo workload and contract tests
        env:
          PYTHONPATH: src
          MOJUM_DM_CONTROL_NATIVE: "1"
        run: python -m unittest discover -s tests -p 'test_dm_control_benchmark.py' -v
