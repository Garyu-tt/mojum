name: GPU Legion agent fanout QA

on:
  pull_request:
    paths:
      - 'tools/gpu_legion_fanout.py'
      - 'tests/test_gpu_legion_fanout.py'
      - 'docs/GPU_LEGION_FANOUT_R01.md'
      - '.github/workflows/gpu-legion-fanout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fanout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile fanout and offline tests
        run: python -m compileall -q tools/gpu_legion_fanout.py tests/test_gpu_legion_fanout.py
      - name: Test no-network fanout slot safety, clone isolation and private outputs
        run: python -m unittest discover -s tests -p 'test_gpu_legion_fanout.py' -v
