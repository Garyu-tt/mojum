name: Mojum R0.15 portable-host epoch-v4 acceptance

on:
  push:
    branches:
      - qa/r015-portable-host-epoch-v4-acceptance-20261121
    paths:
      - src/mojum/portable_host.py
      - tests/test_portable_host.py
      - .github/workflows/r015-portable-host-epoch-v4.yml
  pull_request:
    paths:
      - src/mojum/portable_host.py
      - tests/test_portable_host.py
      - .github/workflows/r015-portable-host-epoch-v4.yml

permissions:
  contents: read

jobs:
  portable-host-v4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile host and tests
        run: python -m compileall -q src/mojum/portable_host.py tests/test_portable_host.py
      - name: Run bounded host SQLite, pacing and epoch-v4 regressions
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_portable_host.py' -v
