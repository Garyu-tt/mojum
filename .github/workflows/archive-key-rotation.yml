name: archive-key-rotation
on:
  pull_request:
    paths:
      - "src/mojum/archive_key_rotation.py"
      - "tests/test_archive_key_rotation.py"
      - "docs/ARCHIVE_KEY_ROTATION_R01.md"
      - ".github/workflows/archive-key-rotation.yml"
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact checked-out PR head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run focused contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_archive_key_rotation.py -v
