name: graph-native-admission

on:
  pull_request:
    paths:
      - "src/mojum/graph.py"
      - "src/mojum/_json_nesting.py"
      - "src/mojum/sim.py"
      - "src/mojum/data/first_loop.json"
      - "examples/first_loop.json"
      - "tests/test_graph_native_admission.py"
      - "docs/GRAPH_V1_NATIVE_ADMISSION_R01.md"
      - ".github/workflows/graph-native-admission.yml"
  push:
    branches: [main]
    paths:
      - "src/mojum/graph.py"
      - "src/mojum/_json_nesting.py"
      - "src/mojum/sim.py"
      - "src/mojum/data/first_loop.json"
      - "examples/first_loop.json"
      - "tests/test_graph_native_admission.py"
      - "docs/GRAPH_V1_NATIVE_ADMISSION_R01.md"
      - ".github/workflows/graph-native-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused native-admission regressions
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_graph_native_admission.py' -v
