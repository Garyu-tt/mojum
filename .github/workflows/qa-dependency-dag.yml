name: QA dependency DAG
on:
  pull_request:
    paths:
      - "src/mojum/qa_dependency_dag.py"
      - "tests/test_qa_dependency_dag.py"
      - "docs/QA_DEPENDENCY_DAG_R01.md"
      - ".github/workflows/qa-dependency-dag.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Compile module
        run: python -m py_compile src/mojum/qa_dependency_dag.py
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_qa_dependency_dag.py" -v
