name: Mojum Spartan OpenAI provider budget QA

on:
  pull_request:
    paths:
      - tools/spartan_openai_provider.py
      - tools/spartan_budget.py
      - tests/test_spartan_openai_provider.py
      - tests/test_spartan_openai_provider_http.py
      - docs/SPARTAN_LOCAL_OPENAI_ADMISSION_R01.md
      - .github/workflows/spartan-openai-provider-qa.yml
  push:
    branches: [main]
    paths:
      - tools/spartan_openai_provider.py
      - tools/spartan_budget.py
      - tests/test_spartan_openai_provider.py
      - tests/test_spartan_openai_provider_http.py
      - .github/workflows/spartan-openai-provider-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spartan-openai-provider:
    name: Spartan OpenAI / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline provider admission and loopback regression tests
        run: python -m unittest discover -s tests -p 'test_spartan_openai_provider*.py' -v
