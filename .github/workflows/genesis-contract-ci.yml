name: GENESIS fixture contracts
on:
  push:
  pull_request:
jobs:
  stdlib-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: GENESIS tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_genesis.py' -v
