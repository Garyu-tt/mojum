name: Legion HTTP response cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/legion-http-response-cleanup.yml"
      - "tools/cpu_legion.py"
      - "tools/gpu_legion_canary.py"
      - "tests/test_legion_http_response_cleanup.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-cleanup:
    name: response cleanup (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify rejected response cleanup and public contracts
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONWARNINGS: error::ResourceWarning
        run: >-
          python -m unittest
          tests.test_legion_http_response_cleanup
          tests.test_gpu_legion_canary
          tests.test_cpu_legion.CpuLegionTests.test_model_redirect_does_not_leave_configured_loopback_endpoint
          -v
