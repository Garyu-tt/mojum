name: Real GENESIS migration integration
on:
  pull_request:
    branches: [dev/core/plugin-loader-r01, core/v2]
permissions:
  contents: read
jobs:
  genesis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 074b14c152c8c5e3291e6e56595255386a751af9
          path: legacy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5b1ba837969eb8bbafd9714ed46701d23bfec130
          path: plugin-candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Standalone plugin tests
        working-directory: plugin-candidate
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Core integration and regression
        env:
          PYTHONPATH: src:legacy/src
        run: python -m unittest discover -s tests -v
