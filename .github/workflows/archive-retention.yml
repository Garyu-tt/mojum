name: archive-retention-planner
on:
  pull_request:
    paths:
      - "src/mojum/archive_retention.py"
      - "tests/test_archive_retention.py"
      - "docs/ARCHIVE_RETENTION_R01.md"
      - ".github/workflows/archive-retention.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact checked-out head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile focused module
        run: python -m compileall -q src/mojum/archive_retention.py tests/test_archive_retention.py
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_archive_retention.py -v
