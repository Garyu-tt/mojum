name: Mojum R0.16 atomic segmented Noosphere journal

on:
  pull_request:
    paths:
      - ".github/workflows/r016-segmented-journal.yml"
      - "src/mojum/segmented_noosphere.py"
      - "tests/test_segmented_noosphere.py"
      - "tests/test_segmented_noosphere_100k_stress.py"
      - "docs/R016_SEGMENTED_JOURNAL_R01.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate first attempts for a PR while keeping retries and other events independent.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  atomic-segment-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate atomic segments, cross-link integrity, tamper and legacy isolation
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_segmented_noosphere.py -v
      - name: Prove original private SQLite journal still works
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_noosphere.py -v

  actual-100k-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Durable 100001 event append plus verified cold restart and 100002 event
        env:
          PYTHONPATH: src
          MOJUM_SEGMENTED_100K_STRESS: "1"
        run: python -m unittest discover -s tests -p test_segmented_noosphere_100k_stress.py -v
