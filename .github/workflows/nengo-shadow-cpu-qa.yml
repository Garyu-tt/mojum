name: Nengo 4.1.0 opt-in CPU shadow QA

on:
  pull_request:
    paths:
      - 'src/mojum/nengo_shadow.py'
      - 'tests/test_nengo_shadow.py'
      - 'docs/NENGO_CPU_SHADOW_R01.md'
      - '.github/workflows/nengo-shadow-cpu-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nengo-cpu-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned optional Nengo research runtime
        run: |
          python -m pip install --only-binary=:all: 'numpy==2.2.6' 'nengo==4.1.0'
          python -m pip check
      - name: Run strict fixture and real Nengo differential
        env:
          PYTHONPATH: src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_nengo_shadow.py' -v
