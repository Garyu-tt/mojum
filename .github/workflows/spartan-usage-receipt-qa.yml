name: Spartan usage receipt exact-head QA

on:
  pull_request:
    paths:
      - "src/mojum/spartan_usage_receipt.py"
      - "tests/test_spartan_usage_receipt.py"
      - ".github/workflows/spartan-usage-receipt-qa.yml"
  push:
    branches:
      - "qa/1111-exact-receipt-types-20261123"
    paths:
      - "src/mojum/spartan_usage_receipt.py"
      - "tests/test_spartan_usage_receipt.py"
      - ".github/workflows/spartan-usage-receipt-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage-receipt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up CPython
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m py_compile src/mojum/spartan_usage_receipt.py tests/test_spartan_usage_receipt.py
      - name: Run usage receipt regressions
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_spartan_usage_receipt.py" -v
