name: Optional CR-SQLite public metadata spike
on:
  pull_request:
    paths:
      - 'src/mojum/crsqlite_metadata_spike.py'
      - 'tests/test_crsqlite_metadata_spike.py'
      - 'docs/CRSQLITE_METADATA_SPIKE_R01.md'
      - '.github/workflows/crsqlite-metadata-spike-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stdlib-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline stdlib tests, no native extension
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_crsqlite_metadata_spike.py -v
      - name: Compile strict boundary
        run: PYTHONPATH=src python -m compileall -q src/mojum/crsqlite_metadata_spike.py tests/test_crsqlite_metadata_spike.py
