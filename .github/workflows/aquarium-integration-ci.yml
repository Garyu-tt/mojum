name: Mojum R0.3 online-learning aquarium regression
on:
  push:
  pull_request:
jobs:
  aquarium-stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run full graph, GENESIS, world, Noosphere and neural regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Offline habitat smoke and restart
        env:
          PYTHONPATH: src
        run: |
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03.sqlite3 --ticks 120 --neural-mode shadow
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03.sqlite3 --ticks 30 --neural-mode shadow
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03-disabled.sqlite3 --ticks 5 --neural-mode disabled
