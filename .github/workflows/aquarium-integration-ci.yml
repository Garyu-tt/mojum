name: Mojum R0.3 online-learning aquarium regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  aquarium-stdlib:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run full graph, GENESIS, world, Noosphere and neural regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reject deferred unclosed SQLite handles on Python 3.13
        if: matrix.python-version == '3.13'
        env:
          PYTHONPATH: src
          PYTHONTRACEMALLOC: '1'
        run: python tests/audit_sqlite_resource_warnings.py
      - name: Offline habitat smoke and restart
        env:
          PYTHONPATH: src
        run: |
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03.sqlite3 --ticks 120 --neural-mode shadow
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03.sqlite3 --ticks 30 --neural-mode shadow
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03-disabled.sqlite3 --ticks 5 --neural-mode disabled
