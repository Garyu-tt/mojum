name: Mojum R0.3 online-learning aquarium regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # Deduplicate obsolete first PR attempts without cancelling reruns,
  # manual dispatches, push runs or retries of a different exact head.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}
jobs:
  aquarium-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python modules
        run: python -m compileall -q src tests
      - name: Run full graph, GENESIS, world, Noosphere and neural regression
        # On 3.13, the full suite runs once in the resource-warning audit below.
        if: matrix.python-version != '3.13'
        env:
          PYTHONPATH: src
          MOJUM_EPOCH_V4_STRESS: '1'
        run: python -m unittest discover -s tests -v
      - name: Reject deferred unclosed SQLite handles on Python 3.13
        if: matrix.python-version == '3.13'
        env:
          PYTHONPATH: src
          MOJUM_EPOCH_V4_STRESS: '1'
          PYTHONTRACEMALLOC: '1'
        run: python tests/audit_sqlite_resource_warnings.py
      - name: Offline habitat smoke and restart
        env:
          PYTHONPATH: src
        run: |
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03.sqlite3 --ticks 120 --neural-mode shadow
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03.sqlite3 --ticks 30 --neural-mode shadow
          python -m mojum.aquarium --db ${{ runner.temp }}/mojum-r03-disabled.sqlite3 --ticks 5 --neural-mode disabled
