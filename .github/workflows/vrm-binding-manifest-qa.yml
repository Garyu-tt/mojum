name: VRM binding manifest focused QA

on:
  pull_request:
    paths:
      - "tools/vrm_binding_manifest.mjs"
      - "tests/test_vrm_binding_manifest.py"
      - "docs/VRM_BINDING_MANIFEST_R01.md"
      - ".github/workflows/vrm-binding-manifest-qa.yml"
  push:
    branches:
      - "qa/**"
    paths:
      - "tools/vrm_binding_manifest.mjs"
      - "tests/test_vrm_binding_manifest.py"
      - "docs/VRM_BINDING_MANIFEST_R01.md"
      - ".github/workflows/vrm-binding-manifest-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check JavaScript syntax
        run: node --check tools/vrm_binding_manifest.mjs
      - name: Run focused VRM binding manifest tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_vrm_binding_manifest.py" -v
