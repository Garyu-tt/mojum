name: vrm-pose-interpolation

on:
  pull_request:
    paths:
      - "src/mojum/vrm_pose_interpolation.py"
      - "tests/test_vrm_pose_interpolation.py"
      - ".github/workflows/vrm-pose-interpolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert tested checkout is PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run focused stdlib suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_vrm_pose_interpolation.py" -v
