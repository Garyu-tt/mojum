name: Cloth snapshot and replay contract
on:
  pull_request:
    paths:
      - "src/mojum/cloth_snapshot.py"
      - "tests/test_cloth_snapshot.py"
      - "docs/CLOTH_SNAPSHOT_R01.md"
      - ".github/workflows/cloth-snapshot-replay.yml"
  push:
    branches: [main]
    paths:
      - "src/mojum/cloth_snapshot.py"
      - "tests/test_cloth_snapshot.py"
      - "docs/CLOTH_SNAPSHOT_R01.md"
      - ".github/workflows/cloth-snapshot-replay.yml"
permissions:
  contents: read
concurrency:
  group: cloth-snapshot-replay-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  snapshot-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile snapshot module
        env:
          PYTHONPATH: src
        run: python -m py_compile src/mojum/cloth_snapshot.py
      - name: Run snapshot and replay regressions
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_cloth_snapshot.py" -v
