name: QA 810 SQLite allocation diagnostics (Python 3.13)

# Narrow, opt-in reproducer for the 3 deferred SQLite ResourceWarnings in #810.
on:
  pull_request:
    paths:
      - '.github/workflows/sqlite-810-allocation-trace-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-810-allocation-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Trace SQLite connections in the complete full-suite leak audit
        env:
          PYTHONPATH: src
          MOJUM_EPOCH_V4_STRESS: '1'
          PYTHONTRACEMALLOC: '1'
          PYTHONWARNINGS: 'default::ResourceWarning'
        run: |
          python -m compileall -q src tests
          python tests/audit_sqlite_resource_warnings.py
