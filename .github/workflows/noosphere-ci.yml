name: Noosphere local event journal (stdlib)
on:
  push:
  pull_request:
jobs:
  local-memory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: SQLite ledger and dataset tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_noosphere.py' -v
      - name: Standalone offline SQLite smoke test
        env:
          PYTHONPATH: src
        run: python examples/noosphere_demo.py
