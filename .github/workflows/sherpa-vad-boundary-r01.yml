name: Optional sherpa VAD synthetic boundary regression
on:
  pull_request:
    paths:
      - 'src/mojum/sherpa_vad.py'
      - 'tests/test_sherpa_vad.py'
      - 'docs/SHERPA_ONNX_VAD_R01.md'
      - '.github/workflows/sherpa-vad-boundary-r01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stdlib-synthetic-vad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify reviewed exact PR HEAD
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run offline, synthetic fake-backend boundary QA
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_sherpa_vad.py' -v
      - name: Compile isolated adapter
        run: python -m compileall -q src/mojum/sherpa_vad.py
