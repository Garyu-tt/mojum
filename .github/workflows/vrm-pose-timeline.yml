name: VRM pose timeline
on:
  pull_request:
    paths:
      - 'tools/vrm_pose_timeline.mjs'
      - 'tests/vrm_pose_timeline.test.mjs'
      - 'docs/VRM_POSE_TIMELINE_R01.md'
      - '.github/workflows/vrm-pose-timeline.yml'
  push:
    branches: [main]
    paths:
      - 'tools/vrm_pose_timeline.mjs'
      - 'tests/vrm_pose_timeline.test.mjs'
      - '.github/workflows/vrm-pose-timeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/vrm_pose_timeline.test.mjs
