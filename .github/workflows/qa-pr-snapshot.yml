name: QA PR snapshot admission

on:
  pull_request:
    paths:
      - "src/mojum/qa_pr_snapshot.py"
      - "tests/test_qa_pr_snapshot.py"
      - "docs/QA_PR_SNAPSHOT_R01.md"
      - ".github/workflows/qa-pr-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Focused contract tests
        run: PYTHONPATH=src python -m unittest tests.test_qa_pr_snapshot -v
