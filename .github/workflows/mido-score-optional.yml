name: Optional Mido SMF score integration
on:
  pull_request:
    paths:
      - 'src/mojum/mido_score.py'
      - 'tests/test_mido_score.py'
      - 'docs/MIDO_MUSIC_SMF_R01.md'
      - '.github/workflows/mido-score-optional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-mido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'mido==1.3.3'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_mido_score.py -v
