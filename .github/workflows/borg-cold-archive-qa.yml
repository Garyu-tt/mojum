name: Mojum optional Borg cold archive acceptance

on:
  pull_request:
    paths:
      - "src/mojum/borg_cold_archive.py"
      - "tests/test_borg_cold_archive*.py"
      - "docs/BORG_COLD_ARCHIVE_R01.md"
      - ".github/workflows/borg-cold-archive-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fake-Borg failure gates and real SQLite WAL/replay
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.test_borg_cold_archive -v
          python -m unittest discover -s tests -p 'test_aquarium_cold_copy.py' -v
          python -m unittest discover -s tests -p 'test_cold_copy_verify_no_mutation.py' -v
  real-borg:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies to build pinned upstream Borg 1.4.5
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libacl1-dev liblz4-dev libzstd-dev libxxhash-dev pkg-config
          python -m pip install --upgrade pip wheel
          python -m pip install "borgbackup==1.4.5"
          borg --version
      - name: Real encrypted Borg end-to-end restore and replay (synthetic only)
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_borg_cold_archive_real -v
