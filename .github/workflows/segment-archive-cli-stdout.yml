name: segment archive CLI stdout QA

on:
  pull_request:
    paths:
      - "src/mojum/segment_archive_cli.py"
      - "tests/test_segment_archive_cli_stdout.py"
      - ".github/workflows/segment-archive-cli-stdout.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_segment_archive_cli_stdout.py" -v
