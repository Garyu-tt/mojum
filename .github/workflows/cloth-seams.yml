name: Cloth seam admission
on:
  pull_request:
    paths:
      - "src/mojum/cloth_seams.py"
      - "tests/test_cloth_seams.py"
      - "docs/CLOTH_SEAMS_R01.md"
      - ".github/workflows/cloth-seams.yml"
  push:
    branches:
      - "build/376-cloth-seams-20261123-r01"
    paths:
      - "src/mojum/cloth_seams.py"
      - "tests/test_cloth_seams.py"
      - ".github/workflows/cloth-seams.yml"
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run focused seam tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_cloth_seams.py' -v
