name: Mojum offline room designer independent QA

on:
  pull_request:
    paths:
      - "tools/room_designer.html"
      - "tools/room_designer.js"
      - "tests/qa_room_designer_node.cjs"
      - ".github/workflows/r015-offline-room-designer.yml"
      - "docs/R015_OFFLINE_ROOM_DESIGNER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-room-designer:
    name: SVG pointer/keyboard + Python ABI (${{ matrix.node-version }} / py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node-version }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Offline HTML/JS UI and exact Python draft preflight
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONWARNINGS: always::ResourceWarning
          PYTHONPATH: src
        run: |
          set -euo pipefail
          node --test tests/qa_room_designer_node.cjs 2>&1 | tee room-designer-qa.log
          if grep -q '^not ok' room-designer-qa.log; then
            echo "FAIL: room designer interaction test" >&2
            exit 1
          fi

  chromium-file-smoke:
    name: actual Chromium file:// startup (desktop + portrait)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open actual offline editor in headless browser, no HTTP server
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          for size in "390,844" "1280,800"; do
            "$BROWSER" \
              --headless=new --no-sandbox --disable-dev-shm-usage \
              --disable-gpu --window-size="$size" --virtual-time-budget=2000 \
              --dump-dom "file://$PWD/tools/room_designer.html" \
              > "room-designer-${size}.html" 2> "chromium-${size}.log"
            grep -F "Модель корректна" "room-designer-${size}.html"
            grep -F "Удалить препятствие 1" "room-designer-${size}.html"
            if grep -E 'Not allowed to load local resource|Uncaught (TypeError|ReferenceError|SyntaxError)' "chromium-${size}.log"; then
              echo "FAIL: browser reported a JS/local-file error" >&2
              exit 1
            fi
          done
