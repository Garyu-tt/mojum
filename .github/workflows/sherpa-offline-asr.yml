name: Sherpa Offline ASR CPU

on:
  pull_request:
    paths:
      - 'src/mojum/sherpa_offline_asr.py'
      - 'tests/test_sherpa_offline_asr.py'
      - '.github/workflows/sherpa-offline-asr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run hermetic synthetic WAV regressions without optional dependencies
        env:
          PYTHONPATH: src
          PYTHONNOUSERSITE: '1'
        run: python -m unittest discover -s tests -p 'test_sherpa_offline_asr.py' -v
