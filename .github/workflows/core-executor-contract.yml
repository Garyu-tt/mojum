name: Core executor extraction
on:
  pull_request:
    branches: [dev/core/graph-contract-r01, core/v2]
  push:
    branches: [dev/core/executor-r01]
permissions:
  contents: read
jobs:
  executor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 074b14c152c8c5e3291e6e56595255386a751af9
          path: legacy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Differential graph and executor tests
        env:
          PYTHONPATH: src:legacy/src
        run: python -m unittest discover -s tests -v
