name: PettingZoo episode admission
on:
  pull_request:
    paths:
      - "src/mojum/pettingzoo_episode.py"
      - "tests/test_pettingzoo_episode.py"
      - "docs/PETTINGZOO_EPISODE_R01.md"
      - ".github/workflows/pettingzoo-episode.yml"
  push:
    branches:
      - "build/700-pettingzoo-episode-20261124"
    paths:
      - "src/mojum/pettingzoo_episode.py"
      - "tests/test_pettingzoo_episode.py"
      - "docs/PETTINGZOO_EPISODE_R01.md"
      - ".github/workflows/pettingzoo-episode.yml"
permissions:
  contents: read
jobs:
  episode-contract:
    name: episode-contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Run focused episode contract tests
        run: PYTHONPATH=src python -m unittest tests.test_pettingzoo_episode -v
