name: spinal-cpg-bridge-qa

on:
  push:
    branches:
      - feat/1360-cpg-motor-gate-bridge
    paths:
      - "src/mojum/spinal_cpg_bridge.py"
      - "src/mojum/spinal_cpg.py"
      - "src/mojum/motor_gate.py"
      - "tests/test_spinal_cpg_bridge.py"
      - ".github/workflows/spinal-cpg-bridge-qa.yml"
  pull_request:
    paths:
      - "src/mojum/spinal_cpg_bridge.py"
      - "src/mojum/spinal_cpg.py"
      - "src/mojum/motor_gate.py"
      - "tests/test_spinal_cpg_bridge.py"
      - ".github/workflows/spinal-cpg-bridge-qa.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without optional dependencies
        run: python -m pip install --no-deps -e .
      - name: Run focused bridge tests
        run: python -m unittest discover -s tests -p "test_spinal_cpg_bridge.py" -v
      - name: Compile changed Python files
        run: python -m compileall -q src/mojum/spinal_cpg_bridge.py tests/test_spinal_cpg_bridge.py
