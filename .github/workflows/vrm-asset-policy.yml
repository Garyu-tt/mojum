name: VRM asset policy
on:
  push:
    paths:
      - "src/mojum/vrm_asset_policy.py"
      - "tests/test_vrm_asset_policy.py"
      - "docs/VRM_ASSET_POLICY_R01.md"
      - ".github/workflows/vrm-asset-policy.yml"
  pull_request:
    paths:
      - "src/mojum/vrm_asset_policy.py"
      - "tests/test_vrm_asset_policy.py"
      - "docs/VRM_ASSET_POLICY_R01.md"
      - ".github/workflows/vrm-asset-policy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused tests
        run: python -m unittest tests.test_vrm_asset_policy -v
