name: Point-room episode adapter QA

on:
  pull_request:
    paths:
      - 'src/mojum/point_room_env.py'
      - 'src/mojum/world_room.py'
      - 'tests/test_point_room_env.py'
      - 'docs/POINT_ROOM_ENV_R01.md'
      - '.github/workflows/point-room-env-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  point-room-env:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile focused modules
        run: python -m compileall -q src/mojum/point_room_env.py src/mojum/world_room.py
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_point_room_env.py' -v
