name: Spartan instrumented RPC meter (offline)
on:
  pull_request:
    paths:
      - 'tools/spartan_inflight_meter.py'
      - 'tests/test_spartan_inflight_meter.py'
      - 'docs/SPARTAN_INFLIGHT_METER_R01.md'
      - '.github/workflows/spartan-inflight-meter.yml'
  push:
    branches: [main]
    paths:
      - 'tools/spartan_inflight_meter.py'
      - 'tests/test_spartan_inflight_meter.py'
      - '.github/workflows/spartan-inflight-meter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-stdlib:
    name: offline stdlib (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: ubuntu-24.04
            python-version: '3.13'
          - os: ubuntu-24.04
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Run SQLite meter regressions without model credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p test_spartan_inflight_meter.py -v
