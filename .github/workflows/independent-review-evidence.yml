name: Independent review evidence contract

on:
  pull_request:
    paths:
      - "src/mojum/independent_review_evidence.py"
      - "tests/test_independent_review_evidence.py"
      - "docs/INDEPENDENT_REVIEW_EVIDENCE_R01.md"
      - ".github/workflows/independent-review-evidence.yml"
  push:
    branches:
      - main
      - "build/712-independent-review-evidence-20261124"
    paths:
      - "src/mojum/independent_review_evidence.py"
      - "tests/test_independent_review_evidence.py"
      - "docs/INDEPENDENT_REVIEW_EVIDENCE_R01.md"
      - ".github/workflows/independent-review-evidence.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested revision
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_independent_review_evidence -v
