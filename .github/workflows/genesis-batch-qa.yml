name: GENESIS batch planner focused QA

on:
  pull_request:
    paths:
      - "src/mojum/genesis_batch.py"
      - "src/mojum/genesis.py"
      - "tests/test_genesis_batch.py"
      - "docs/GENESIS_BATCH_R01.md"
      - ".github/workflows/genesis-batch-qa.yml"
  push:
    branches:
      - "build/4-genesis-batch-transaction-20261123-r01"
    paths:
      - "src/mojum/genesis_batch.py"
      - "src/mojum/genesis.py"
      - "tests/test_genesis_batch.py"
      - "docs/GENESIS_BATCH_R01.md"
      - ".github/workflows/genesis-batch-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile module and tests
        run: python -m py_compile src/mojum/genesis_batch.py tests/test_genesis_batch.py
      - name: Run focused batch regressions
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_genesis_batch.py" -v
