name: sqlite-schema-fingerprint-qa

on:
  pull_request:
    paths:
      - "src/mojum/sqlite_schema_fingerprint.py"
      - "tests/test_sqlite_schema_fingerprint.py"
      - "docs/SQLITE_SCHEMA_FINGERPRINT_QA_R01.md"
      - ".github/workflows/sqlite-schema-fingerprint-qa.yml"
  push:
    branches:
      - "qa/**"
    paths:
      - "src/mojum/sqlite_schema_fingerprint.py"
      - "tests/test_sqlite_schema_fingerprint.py"
      - "docs/SQLITE_SCHEMA_FINGERPRINT_QA_R01.md"
      - ".github/workflows/sqlite-schema-fingerprint-qa.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_sqlite_schema_fingerprint.py" -v
