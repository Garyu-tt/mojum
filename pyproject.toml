[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mojum"
version = "0.1.0"
description = "Experimental CPU-first synthetic organism aquarium (not a complete digital organism)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vector-search = ["sqlite-vec==0.1.9"]

[project.scripts]
mojum-aquarium = "mojum.aquarium:main"
mojum-aquarium-wire = "mojum.aquarium_wire:main"
mojum-motor-mobility = "mojum.motor_mobility:main"
mojum-fixture = "mojum.__main__:main"
mojum-host = "mojum.portable_host:cli"
mojum-room-check = "mojum.room_spec:main"
mojum-motor-play-v2 = "mojum.motor_play_v2_eval:main"
mojum-merge-gate = "mojum.merge_gate:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["mojum*"]

[tool.setuptools.package-data]
mojum = ["data/*.json"]
